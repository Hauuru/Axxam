<!DOCTYPE html>
<html lang="fr">
<head>

    <title>Chatbot GLM - Assistant Axxam</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

            color: #e2e8f0;

            border: 1px solid #334155;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);

            max-width: 780px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 95vh;
        }

        /* ===== EN-TÊTE ===== */
        .app-header {
            background: linear-gradient(135deg, #0f172a, #16202b);
            border-bottom: 2px solid #22c55e;
            padding: 20px 28px;
            color: #e2e8f0;
        }

        .app-header .header-tag {
            display: block;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #22c55e;
            margin-bottom: 6px;
        }

        .app-header h1 {

            font-weight: 600;
            letter-spacing: -0.3px;
            color: #4ade80;
        }

        .app-header p {

            opacity: 0.85;
            margin-top: 4px;
            font-weight: 300;
            color: #94a3b8;
        }

        /* ===== ZONE DE CONFIGURATION ===== */
        .config-area {
            padding: 18px 28px;
            background: #16202b;
            border-bottom: 1px solid #334155;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .config-area label {
            font-size: 14px;
            font-weight: 500;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-area input[type="password"] {
            flex: 1;
            min-width: 180px;
            padding: 10px 14px;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            background: #0f172a;
            color: #e2e8f0;
            transition: border 0.2s, box-shadow 0.2s;

        .config-area input[type="password"]:focus {

            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        .config-area input[type="password"]:disabled {
            background: #1e293b;
            cursor: not-allowed;
        }

        .config-area select {
            padding: 10px 14px;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            background: #0f172a;
            color: #e2e8f0;
            cursor: pointer;
        }

        .config-area select:focus {
            outline: none;
            border-color: #22c55e;
        }

        .config-area select:disabled {
            background: #1e293b;
            cursor: not-allowed;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-primary {
            background: #22c55e;
            color: #0f172a;
        }

        .btn-primary:hover:not(:disabled) {
            background: #4ade80;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #15803d;
        }

        .btn-success:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== STATUT ===== */
        .status-badge {

            font-weight: 500;
            background: #1e293b;
            color: #94a3b8;

        let apiKey = '';

        // ============================================================
        //  RENDU MARKDOWN (parser léger maison, nœuds DOM uniquement)
        // ============================================================

        function renderInline(node, text) {
            const patterns = [
                { re: /`([^`]+)`/, type: 'code' },
                { re: /\*\*([^*]+)\*\*/, type: 'bold' },
                { re: /\*([^*]+)\*/, type: 'italic' },
                { re: /\[([^\]]+)\]\(([^)\s]+)\)/, type: 'link' }
            ];

            let best = null;
            for (const p of patterns) {
                const m = text.match(p.re);
                if (m && (!best || m.index < best.m.index)) best = { m, type: p.type };
            }
            if (!best) {
                node.appendChild(document.createTextNode(text));
                return;
            }

            const { m, type } = best;
            if (m.index > 0) {
                node.appendChild(document.createTextNode(text.slice(0, m.index)));
            }
            if (type === 'code') {
                const code = document.createElement('code');
                code.textContent = m[1];
                node.appendChild(code);
            } else if (type === 'bold') {
                const b = document.createElement('strong');
                renderInline(b, m[1]);
                node.appendChild(b);
            } else if (type === 'italic') {
                const i = document.createElement('em');
                renderInline(i, m[1]);
                node.appendChild(i);
            } else if (type === 'link' && /^https?:\/\//i.test(m[2])) {
                const a = document.createElement('a');
                a.href = m[2];
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = m[1];
                node.appendChild(a);
            } else if (type === 'link') {
                node.appendChild(document.createTextNode(m[1] + ' (' + m[2] + ')'));
            }
            renderInline(node, text.slice(m.index + m[0].length));
        }

        function renderMarkdown(text) {
            const frag = document.createDocumentFragment();
            const lines = text.replace(/\r\n/g, '\n').split('\n');
            let codeBlock = null;
            let listType = null;
            let currentList = null;
            let currentParagraph = null;

            const flushParagraph = () => {
                if (currentParagraph) {
                    if (currentParagraph.textContent.trim() !== '') {
                        frag.appendChild(currentParagraph);
                    }
                    currentParagraph = null;
                }
            };

            const flushList = () => {
                if (currentList) {
                    frag.appendChild(currentList);
                    currentList = null;
                    listType = null;
                }
            };

            for (const line of lines) {
                if (/^```/.test(line)) {
                    flushParagraph();
                    flushList();
                    if (codeBlock === null) {
                        const pre = document.createElement('pre');
                        pre.className = 'md-code';
                        pre.appendChild(document.createElement('code'));
                        codeBlock = pre;
                    } else {
                        frag.appendChild(codeBlock);
                        codeBlock = null;
                    }
                    continue;
                }
                if (codeBlock !== null) {
                    const codeEl = codeBlock.querySelector('code');
                    if (codeEl.textContent.length > 0) codeEl.textContent += '\n';
                    codeEl.textContent += line;
                    continue;
                }

                const heading = line.match(/^(#{1,3})\s+(.*)$/);
                if (heading) {
                    flushParagraph();
                    flushList();
                    const h = document.createElement('h' + (heading[1].length + 1));
                    h.className = 'md-h';
                    renderInline(h, heading[2]);
                    frag.appendChild(h);
                    continue;
                }

                if (/^\s*---+\s*$/.test(line)) {
                    flushParagraph();
                    flushList();
                    frag.appendChild(document.createElement('hr'));
                    continue;
                }

                const quote = line.match(/^>\s?(.*)$/);
                if (quote) {
                    flushParagraph();
                    flushList();
                    const bq = document.createElement('blockquote');
                    bq.className = 'md-quote';
                    renderInline(bq, quote[1]);
                    frag.appendChild(bq);
                    continue;
                }

                const ulMatch = line.match(/^\s*[-*•]\s+(.*)$/);
                const olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
                if (ulMatch || olMatch) {
                    flushParagraph();
                    const isUl = !!ulMatch;
                    if (!currentList || listType !== (isUl ? 'ul' : 'ol')) {
                        flushList();
                        currentList = document.createElement(isUl ? 'ul' : 'ol');
                        currentList.className = 'md-list';
                        listType = isUl ? 'ul' : 'ol';
                    }
                    const li = document.createElement('li');
                    renderInline(li, isUl ? ulMatch[1] : olMatch[1]);
                    currentList.appendChild(li);
                    continue;
                }

                if (line.trim() === '') {
                    flushParagraph();
                    flushList();
                    continue;
                }

                flushList();
                if (!currentParagraph) {
                    currentParagraph = document.createElement('p');
                    currentParagraph.className = 'md-p';
                } else {
                    currentParagraph.appendChild(document.createElement('br'));
                }
                renderInline(currentParagraph, line.trim());
            }
            flushParagraph();
            flushList();
            return frag;
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            if (type === 'assistant') {
                div.appendChild(renderMarkdown(text));
            } else {
                div.textContent = text;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setStatus(text, isActive = false) {
            statusBadge.textContent = text;
            statusBadge.className = 'status-badge' + (isActive ? ' active' : '');
        }

        function setUIEnabled(enabled) {
            userInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            apiKeyInput.disabled = enabled;
            modelSelect.disabled = enabled;
            saveKeyBtn.disabled = enabled;
            if (enabled) {
                resetKeyBtn.style.display = 'inline-block';
                userInput.focus();
            } else {
                resetKeyBtn.style.display = 'none';
            }
        }

        function resetChat(keepSystem = true) {
            chatBox.innerHTML = '';
            if (keepSystem) {
                addMessage('💡 Session réinitialisée. Vous pouvez continuer à discuter.', 'system');
            } else {
                addMessage('💡 Entrez votre clé API GLM puis cliquez sur « Démarrer ».', 'system');
            }
            // On garde seulement le message système dans l'historique
            conversationHistory.length = 1;
        }

        // ============================================================
        //  APPEL À L'API GLM
        // ============================================================

        async function callGLM(messages) {
            const key = apiKey || sessionStorage.getItem('glm_api_key');
            if (!key) {
                throw new Error('Clé API manquante. Veuillez la saisir.');
            }

            const model = currentModel || sessionStorage.getItem('glm_model') || 'glm-4.7-flash';

            console.log(`📡 Appel à GLM avec le modèle : ${model}`);

            const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 2048,
                    top_p: 0.9
                })
            });

            // Gestion des erreurs détaillée
            if (!response.ok) {
                let errorMsg = `Erreur HTTP ${response.status}`;
                let errorDetail = '';
                try {
                    const errData = await response.json();
                    console.error('📛 Détails de l\'erreur GLM :', errData);
                    errorDetail = errData.error?.message || errData.message || '';
                    if (errData.error?.code) {
                        errorMsg += ` [${errData.error.code}]`;
                    }
                } catch (_) { /* ignore */ }
                
                if (errorDetail.includes('model') || errorDetail.includes('Model')) {
                    errorMsg = `❌ Modèle invalide. Vérifiez que "${model}" est correct. 
                                Modèles disponibles : glm-4.7-flash, glm-4-flash, glm-4-air, glm-4-plus, glm-4, glm-3-turbo`;
                } else if (errorDetail) {
                    errorMsg = errorDetail;
                }
                throw new Error(errorMsg);
            }

            return await response.json();
        }

        // ============================================================
        //  ENVOI D'UN MESSAGE
        // ============================================================

        async function sendUserMessage() {
            const text = userInput.value.trim();
            if (!text || !isReady) return;

            // Désactiver le temps de l'appel
            userInput.disabled = true;
            sendBtn.disabled = true;
            setStatus('⏳ Envoi...', false);

            // Afficher le message de l'utilisateur
            addMessage(text, 'user');
            conversationHistory.push({ role: 'user', content: text });
            userInput.value = '';
            userInput.style.height = 'auto';

            try {
                const data = await callGLM(conversationHistory);
                const reply = data.choices?.[0]?.message?.content;

                if (!reply) {
                    throw new Error('Réponse invalide de l\'API');
                }

                addMessage(reply, 'assistant');
                conversationHistory.push({ role: 'assistant', content: reply });
                setStatus('✅ Connecté', true);

            } catch (error) {
                addMessage(`⚠️ ${error.message}`, 'error');
                setStatus('❌ Erreur', false);
                // On retire le message utilisateur de l'historique pour éviter la confusion
                conversationHistory.pop();
            }

            // Réactiver
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        // ============================================================
        //  INITIALISATION DE LA SESSION
        // ============================================================

        function initSession(key, model) {
            apiKey = key;
            currentModel = model;
            isReady = true;
            
            // Sauvegarder les préférences
            sessionStorage.setItem('glm_api_key', key);
            sessionStorage.setItem('glm_model', model);
            
            setUIEnabled(true);
            setStatus('✅ Connecté', true);
            resetChat(true);
            addMessage(`🤖 Bonjour ! Je suis l'assistant Axxam (modèle ${model}). Je présente les services d'Axxam et vous redirige vers les bonnes pages. Comment puis-je vous aider ?`, 'assistant');
            conversationHistory.push({
                role: 'assistant',
                content: `Bonjour ! Je suis l'assistant Axxam (modèle ${model}). Je présente les services d'Axxam et vous redirige vers les bonnes pages. Comment puis-je vous aider ?`
            });
            apiKeyInput.value = '•••••••••••••';
        }

        // ============================================================
        //  ÉVÉNEMENTS
        // ============================================================

        // --- Sauvegarder la clé ---
        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                addMessage('⚠️ Veuillez entrer une clé API valide.', 'error');
                return;
            }
            if (!key.startsWith('sk-')) {
                addMessage('⚠️ La clé semble invalide (doit commencer par "sk-").', 'error');
                return;
            }

            const model = modelSelect.value;
            
            // Réinitialiser l'historique (on garde le system)
            conversationHistory.length = 1;
            resetChat(false);
            initSession(key, model);
        });

        // --- Changer de clé ---
        resetKeyBtn.addEventListener('click', () => {
            sessionStorage.removeItem('glm_api_key');
            sessionStorage.removeItem('glm_model');
            apiKey = '';
            isReady = false;
            setUIEnabled(false);
            setStatus('⏳ En attente', false);
            conversationHistory.length = 1;
            resetChat(false);
            apiKeyInput.value = '';
            apiKeyInput.disabled = false;
            modelSelect.disabled = false;
            saveKeyBtn.disabled = false;
            resetKeyBtn.style.display = 'none';
            addMessage('💡 Veuillez entrer une nouvelle clé API.', 'system');
        });

        // --- Envoyer avec bouton ---
        sendBtn.addEventListener('click', sendUserMessage);

        // --- Envoyer avec Ctrl+Entrée ou Entrée (sans Shift) ---
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendUserMessage();
            }
        });

        // --- Auto-resize du textarea ---
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        // ============================================================
        //  CHARGEMENT : RESTAURER LA SESSION
        // ============================================================

        window.addEventListener('load', () => {
            const savedKey = sessionStorage.getItem('glm_api_key');
            const savedModel = sessionStorage.getItem('glm_model') || 'glm-4.7-flash';
            
            // Restaurer le modèle sélectionné
            if (savedModel) {
                modelSelect.value = savedModel;
            }
            
            if (savedKey && savedKey.startsWith('sk-')) {
                // On initialise directement
                conversationHistory.length = 1;
                resetChat(false);
                initSession(savedKey, savedModel);
                addMessage('🔄 Session restaurée. Bon retour !', 'system');
            } else {
                // Si une clé corrompue existe, on la nettoie
                sessionStorage.removeItem('glm_api_key');
                setStatus('⏳ En attente', false);
            }
        });

        // ============================================================
        //  ASTUCE : CLIQUEZ SUR LE STATUT POUR VOIR L'ÉTAT DE LA CLÉ
        // ============================================================
        statusBadge.addEventListener('dblclick', () => {
            if (apiKey) {
                const masked = apiKey.slice(0, 6) + '••••••••' + apiKey.slice(-4);
                addMessage(`🔑 Clé actuelle : ${masked}`, 'system');
                addMessage(`🧠 Modèle actuel : ${currentModel}`, 'system');
            } else {
                addMessage('🔑 Aucune clé enregistrée.', 'system');
            }
        });

        console.log('🚀 Chatbot GLM Axxam chargé !');
        console.log('📋 Modèles disponibles : glm-4.7-flash (⭐ recommandé), glm-4-flash, glm-4-air, glm-4-plus, glm-4, glm-3-turbo');
        console.log('💡 Double-cliquez sur le statut pour voir votre clé (masquée).');
    </script>

</body>
</html>
