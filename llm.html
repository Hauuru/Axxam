<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot GLM - Assistant Axxam</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== CONTENEUR PRINCIPAL ===== */
        .app-container {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 780px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-height: 95vh;
        }

        /* ===== EN-TÊTE ===== */
        .app-header {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 20px 28px;
            color: white;
        }

        .app-header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .app-header p {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
            font-weight: 300;
        }

        /* ===== ZONE DE CONFIGURATION ===== */
        .config-area {
            padding: 18px 28px;
            background: #f8fafc;
            border-bottom: 1px solid #e9edf2;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .config-area label {
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .config-area input[type="password"] {
            flex: 1;
            min-width: 180px;
            padding: 10px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            transition: border 0.2s;
        }

        .config-area input[type="password"]:focus {
            outline: none;
            border-color: #1a2a6c;
            box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.15);
        }

        .config-area input[type="password"]:disabled {
            background: #eef2f6;
            cursor: not-allowed;
        }

        .config-area select {
            padding: 10px 14px;
            border: 1px solid #d1d9e6;
            border-radius: 10px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .config-area select:focus {
            outline: none;
            border-color: #1a2a6c;
        }

        .config-area select:disabled {
            background: #eef2f6;
            cursor: not-allowed;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-primary {
            background: #1a2a6c;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0f1a4a;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #15803d;
        }

        .btn-success:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== STATUT ===== */
        .status-badge {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            background: #e2e8f0;
            color: #475569;
        }

        .status-badge.active {
            background: #dcfce7;
            color: #166534;
        }

        /* ===== ZONE DE CHAT ===== */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 28px;
            min-height: 320px;
            max-height: 440px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Messages */
        .message {
            max-width: 82%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            background: #1a2a6c;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #f1f4f9;
            color: #0f172a;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            background: #fef9c3;
            color: #713f12;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 20px;
            max-width: 95%;
            text-align: center;
        }

        .message.error {
            align-self: center;
            background: #fee2e2;
            color: #991b1b;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 20px;
            max-width: 95%;
            text-align: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== ZONE DE SAISIE ===== */
        .input-area {
            padding: 16px 28px 24px;
            background: #f8fafc;
            border-top: 1px solid #e9edf2;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d9e6;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 48px;
            max-height: 120px;
            background: white;
            transition: border 0.2s;
            line-height: 1.4;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #1a2a6c;
            box-shadow: 0 0 0 3px rgba(26, 42, 108, 0.12);
        }

        .input-area textarea:disabled {
            background: #eef2f6;
            cursor: not-allowed;
        }

        .input-area .btn {
            padding: 12px 22px;
            align-self: stretch;
        }

        /* ===== SCROLLBAR ===== */
        .chat-box::-webkit-scrollbar {
            width: 5px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .chat-box::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* ===== LIEN RETOUR PORTAL ===== */
        .back-link {
            position: absolute;
            top: 16px;
            left: 16px;
            font-size: 14px;
            font-weight: 600;
            color: #1a2a6c;
            background: #ffffff;
            padding: 8px 14px;
            border-radius: 999px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            text-decoration: none;
            z-index: 10;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .back-link:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        }

        @media (max-width: 600px) {
            .back-link {
                top: 10px;
                left: 10px;
                padding: 6px 12px;
                font-size: 13px;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .config-area {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .config-area input[type="password"] {
                min-width: unset;
            }

            .input-area {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .input-area textarea {
                min-height: 44px;
                max-height: 80px;
            }

            .message {
                max-width: 94%;
                font-size: 14px;
            }

            .app-header h1 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-link">← Retour au portail</a>

    <div class="app-container">

        <!-- EN-TÊTE -->
        <header class="app-header">
            <h1>🤖 Assistant Axxam</h1>
            <p>Présente les services d'Axxam et redirige vers les bonnes pages — Entrez votre clé API pour commencer</p>
        </header>

        <!-- CONFIGURATION -->
        <div class="config-area" id="configArea">
            <label for="apiKeyInput">🔑 Clé API GLM :</label>
            <input type="password" id="apiKeyInput" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx" />
            
            <label for="modelSelect">🧠 Modèle :</label>
            <select id="modelSelect">
                <option value="glm-4.7-flash" selected>⭐ GLM-4.7 Flash (gratuit, recommandé)</option>
                <option value="glm-4-flash">GLM-4 Flash (rapide)</option>
                <option value="glm-4-air">GLM-4 Air (équilibré)</option>
                <option value="glm-4-plus">GLM-4 Plus (meilleure qualité)</option>
                <option value="glm-4">GLM-4 (standard)</option>
                <option value="glm-3-turbo">GLM-3 Turbo (économique)</option>
            </select>
            
            <button class="btn btn-primary" id="saveKeyBtn">🔓 Démarrer</button>
            <button class="btn btn-danger" id="resetKeyBtn" style="display:none;">🔄 Changer de clé</button>
            <span class="status-badge" id="statusBadge">⏳ En attente</span>
        </div>

        <!-- ZONE DE CHAT -->
        <div class="chat-box" id="chatBox">
            <div class="message system">💡 Entrez votre clé API GLM puis cliquez sur « Démarrer ».</div>
        </div>

        <!-- ZONE DE SAISIE -->
        <div class="input-area">
            <textarea id="userInput" rows="1" placeholder="Écrivez votre message..." disabled></textarea>
            <button class="btn btn-success" id="sendBtn" disabled>Envoyer</button>
        </div>

    </div>

    <script>
        // ============================================================
        //  CONFIGURATION - PERSONNALISEZ ICI
        // ============================================================

        // --- Contexte personnalisé (modifiez cette variable !) ---
        const CUSTOM_CONTEXT = `
        Vous êtes l'assistant officiel d'Axxam : votre rôle est de présenter les services de l'univers Axxam et de rediriger l'utilisateur vers les bonnes pages.

        VOTRE RÔLE :
        - Répondez en français, de façon concise, professionnelle et chaleureuse.
        - Quand l'utilisateur s'intéresse à un service ou un sujet, présentez-le brièvement puis donnez le lien vers la page concernée (lien en clair).
        - Si l'utilisateur ne précise pas son besoin, proposez-lui les principaux sites.
        - Si vous ne connaissez pas une information, dites-le honnêtement et proposez le contact humain.
        - Ne donnez JAMAIS d'informations inventées sur les services : redirigez toujours vers les pages officielles ci-dessous.

        LES SITES ET SERVICES D'AXXAM :
        1) Portail Axxam — https://axxam.net/ — point d'entrée vers tous les sites.
        2) Axxam Animations — https://axxam.net/animation/ — animations créatives et durables pour tous les âges et tous les événements (anniversaires, mariages, entreprises) : jeux de société (initiation et création sur-mesure), argile (modelage, boudinage, tournage), permaculture (jardinage bio et ateliers pratiques). Tarifs : dès 50 €/heure, 150 €/demi-journée, 250 €/journée, forfait travail régulier. Pages utiles : services.html, tarifs.html, contact.html.
        3) Axxam Numérique — https://axxam.net/numerique.html — services numériques : création de pages web en HTML/CSS, initiation aux agents IA hébergés sur l'ordinateur (Nanobot, OpenClaw), automatisation de tâches simples et répétitives, dépannage informatique, impression 3D.
        4) Poterie Axxam Touraine — https://axxam.net/poterie/ — atelier de tourneur potier : gobelets tournés main en grès de Saint-Amant, cuits et émaillés à l'atelier (oxydes de fer et de cuivre, sans plomb, usage alimentaire). Découvrir la pratique (pratique.html), la galerie (galerie.html) et le générateur de gobelet 3D (gobelet/).
        5) Boxing Club SPDC — https://axxam.net/boxingclubspdc/ — club de boxe affilié à la FFB à Saint-Pierre-des-Corps : boxe anglaise pour jeunes et adultes, remise en forme, coaching personnalisé, entraîneurs diplômés.
        6) VESEMT — https://axxam.net/vesemt.org/ — comité populaire et bienveillant engagé pour la solidarité et la démocratie en métropole tourangelle : actions, analyses et actualités.
        7) Château Ambulant — https://axxam.net/chateauambulant/ — grimoire documentant l'architecture, la sécurité, la poésie et la mémoire du Foyer de Calcifère.

        CONTACT HUMAIN :
        - E-mail : contact@axxam.net
        - Téléphone : 06 51 65 87 77
        - Instagram : @anerazwellaneknu (poterie : @axxamtouraine)

        EXEMPLES DE RÉPONSES :
        - « Je cherche des animations pour un anniversaire » → présenter Axxam Animations puis donner https://axxam.net/animation/ (et tarifs.html pour les prix).
        - « Tu fais des sites web ? » → présenter Axxam Numérique puis donner https://axxam.net/numerique.html.
        - « Comment vous contacter ? » → donner l'e-mail et le téléphone.
        - « Que proposez-vous ? » → lister les sites et leurs pages.
        `;

        // ============================================================
        //  ÉTAT
        // ============================================================

        let apiKey = '';
        let isReady = false;
        let currentModel = 'glm-4.7-flash';

        const conversationHistory = [{
            role: 'system',
            content: CUSTOM_CONTEXT
        }];

        // ============================================================
        //  DOM REFS
        // ============================================================

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const modelSelect = document.getElementById('modelSelect');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const resetKeyBtn = document.getElementById('resetKeyBtn');
        const statusBadge = document.getElementById('statusBadge');

        // ============================================================
        //  FONCTIONS UTILITAIRES
        // ============================================================

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setStatus(text, isActive = false) {
            statusBadge.textContent = text;
            statusBadge.className = 'status-badge' + (isActive ? ' active' : '');
        }

        function setUIEnabled(enabled) {
            userInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            apiKeyInput.disabled = enabled;
            modelSelect.disabled = enabled;
            saveKeyBtn.disabled = enabled;
            if (enabled) {
                resetKeyBtn.style.display = 'inline-block';
                userInput.focus();
            } else {
                resetKeyBtn.style.display = 'none';
            }
        }

        function resetChat(keepSystem = true) {
            chatBox.innerHTML = '';
            if (keepSystem) {
                addMessage('💡 Session réinitialisée. Vous pouvez continuer à discuter.', 'system');
            } else {
                addMessage('💡 Entrez votre clé API GLM puis cliquez sur « Démarrer ».', 'system');
            }
            // On garde seulement le message système dans l'historique
            conversationHistory.length = 1;
        }

        // ============================================================
        //  APPEL À L'API GLM
        // ============================================================

        async function callGLM(messages) {
            const key = apiKey || sessionStorage.getItem('glm_api_key');
            if (!key) {
                throw new Error('Clé API manquante. Veuillez la saisir.');
            }

            const model = currentModel || sessionStorage.getItem('glm_model') || 'glm-4.7-flash';

            console.log(`📡 Appel à GLM avec le modèle : ${model}`);

            const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${key}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: messages,
                    temperature: 0.7,
                    max_tokens: 2048,
                    top_p: 0.9
                })
            });

            // Gestion des erreurs détaillée
            if (!response.ok) {
                let errorMsg = `Erreur HTTP ${response.status}`;
                let errorDetail = '';
                try {
                    const errData = await response.json();
                    console.error('📛 Détails de l\'erreur GLM :', errData);
                    errorDetail = errData.error?.message || errData.message || '';
                    if (errData.error?.code) {
                        errorMsg += ` [${errData.error.code}]`;
                    }
                } catch (_) { /* ignore */ }
                
                if (errorDetail.includes('model') || errorDetail.includes('Model')) {
                    errorMsg = `❌ Modèle invalide. Vérifiez que "${model}" est correct. 
                                Modèles disponibles : glm-4.7-flash, glm-4-flash, glm-4-air, glm-4-plus, glm-4, glm-3-turbo`;
                } else if (errorDetail) {
                    errorMsg = errorDetail;
                }
                throw new Error(errorMsg);
            }

            return await response.json();
        }

        // ============================================================
        //  ENVOI D'UN MESSAGE
        // ============================================================

        async function sendUserMessage() {
            const text = userInput.value.trim();
            if (!text || !isReady) return;

            // Désactiver le temps de l'appel
            userInput.disabled = true;
            sendBtn.disabled = true;
            setStatus('⏳ Envoi...', false);

            // Afficher le message de l'utilisateur
            addMessage(text, 'user');
            conversationHistory.push({ role: 'user', content: text });
            userInput.value = '';
            userInput.style.height = 'auto';

            try {
                const data = await callGLM(conversationHistory);
                const reply = data.choices?.[0]?.message?.content;

                if (!reply) {
                    throw new Error('Réponse invalide de l\'API');
                }

                addMessage(reply, 'assistant');
                conversationHistory.push({ role: 'assistant', content: reply });
                setStatus('✅ Connecté', true);

            } catch (error) {
                addMessage(`⚠️ ${error.message}`, 'error');
                setStatus('❌ Erreur', false);
                // On retire le message utilisateur de l'historique pour éviter la confusion
                conversationHistory.pop();
            }

            // Réactiver
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        // ============================================================
        //  INITIALISATION DE LA SESSION
        // ============================================================

        function initSession(key, model) {
            apiKey = key;
            currentModel = model;
            isReady = true;
            
            // Sauvegarder les préférences
            sessionStorage.setItem('glm_api_key', key);
            sessionStorage.setItem('glm_model', model);
            
            setUIEnabled(true);
            setStatus('✅ Connecté', true);
            resetChat(true);
            addMessage(`🤖 Bonjour ! Je suis l'assistant Axxam (modèle ${model}). Je présente les services d'Axxam et vous redirige vers les bonnes pages. Comment puis-je vous aider ?`, 'assistant');
            conversationHistory.push({
                role: 'assistant',
                content: `Bonjour ! Je suis l'assistant Axxam (modèle ${model}). Je présente les services d'Axxam et vous redirige vers les bonnes pages. Comment puis-je vous aider ?`
            });
            apiKeyInput.value = '•••••••••••••';
        }

        // ============================================================
        //  ÉVÉNEMENTS
        // ============================================================

        // --- Sauvegarder la clé ---
        saveKeyBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                addMessage('⚠️ Veuillez entrer une clé API valide.', 'error');
                return;
            }
            if (!key.startsWith('sk-')) {
                addMessage('⚠️ La clé semble invalide (doit commencer par "sk-").', 'error');
                return;
            }

            const model = modelSelect.value;
            
            // Réinitialiser l'historique (on garde le system)
            conversationHistory.length = 1;
            resetChat(false);
            initSession(key, model);
        });

        // --- Changer de clé ---
        resetKeyBtn.addEventListener('click', () => {
            sessionStorage.removeItem('glm_api_key');
            sessionStorage.removeItem('glm_model');
            apiKey = '';
            isReady = false;
            setUIEnabled(false);
            setStatus('⏳ En attente', false);
            conversationHistory.length = 1;
            resetChat(false);
            apiKeyInput.value = '';
            apiKeyInput.disabled = false;
            modelSelect.disabled = false;
            saveKeyBtn.disabled = false;
            resetKeyBtn.style.display = 'none';
            addMessage('💡 Veuillez entrer une nouvelle clé API.', 'system');
        });

        // --- Envoyer avec bouton ---
        sendBtn.addEventListener('click', sendUserMessage);

        // --- Envoyer avec Ctrl+Entrée ou Entrée (sans Shift) ---
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendUserMessage();
            }
        });

        // --- Auto-resize du textarea ---
        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        // ============================================================
        //  CHARGEMENT : RESTAURER LA SESSION
        // ============================================================

        window.addEventListener('load', () => {
            const savedKey = sessionStorage.getItem('glm_api_key');
            const savedModel = sessionStorage.getItem('glm_model') || 'glm-4.7-flash';
            
            // Restaurer le modèle sélectionné
            if (savedModel) {
                modelSelect.value = savedModel;
            }
            
            if (savedKey && savedKey.startsWith('sk-')) {
                // On initialise directement
                conversationHistory.length = 1;
                resetChat(false);
                initSession(savedKey, savedModel);
                addMessage('🔄 Session restaurée. Bon retour !', 'system');
            } else {
                // Si une clé corrompue existe, on la nettoie
                sessionStorage.removeItem('glm_api_key');
                setStatus('⏳ En attente', false);
            }
        });

        // ============================================================
        //  ASTUCE : CLIQUEZ SUR LE STATUT POUR VOIR L'ÉTAT DE LA CLÉ
        // ============================================================
        statusBadge.addEventListener('dblclick', () => {
            if (apiKey) {
                const masked = apiKey.slice(0, 6) + '••••••••' + apiKey.slice(-4);
                addMessage(`🔑 Clé actuelle : ${masked}`, 'system');
                addMessage(`🧠 Modèle actuel : ${currentModel}`, 'system');
            } else {
                addMessage('🔑 Aucune clé enregistrée.', 'system');
            }
        });

        console.log('🚀 Chatbot GLM Axxam chargé !');
        console.log('📋 Modèles disponibles : glm-4.7-flash (⭐ recommandé), glm-4-flash, glm-4-air, glm-4-plus, glm-4, glm-3-turbo');
        console.log('💡 Double-cliquez sur le statut pour voir votre clé (masquée).');
    </script>

</body>
</html>
