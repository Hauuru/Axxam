<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFC — Observation cardiaque</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8a92a6;
    --accent: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

  .preview-wrap {
    position: relative;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 1;
    max-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #video.hidden { display: none; }
  .placeholder {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 16px;
    text-align: center;
  }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card-label {
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .bpm-value {
    font-size: 3rem;
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .bpm-unit { color: var(--muted); font-size: 0.85rem; margin-left: 4px; }

  .quality-value {
    font-size: 1.25rem;
    font-weight: 600;
  }
  .quality-value[data-level="good"] { color: var(--accent); }
  .quality-value[data-level="mid"] { color: var(--warn); }
  .quality-value[data-level="bad"] { color: var(--bad); }

  .reason {
    color: var(--muted);
    font-size: 0.85rem;
    min-height: 1.2em;
    margin-top: 4px;
  }
  .reason[data-code="clip"], .reason[data-code="motion"] { color: var(--warn); }
  .reason[data-code="weak"], .reason[data-code="noisy"] { color: var(--bad); }

  #signal-canvas {
    width: 100%;
    height: 80px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .controls { display: flex; gap: 8px; }
  button {
    flex: 1;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: var(--accent);
    color: #0a0f0a;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.stop { background: var(--bad); color: #1a0505; }

  .debug {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4px 16px;
  }
  .debug span:nth-child(odd) { color: #6b7280; }
  .debug span:nth-child(even) { color: var(--text); text-align: right; }
</style>
</head>
<body>
<div class="app">
  <div>
    <h1>Observation cardiaque</h1>
    <div class="subtitle">Placez votre doigt sur l'objectif arrière, sans appuyer trop fort.</div>
  </div>

  <div class="preview-wrap">
    <video id="video" class="hidden" autoplay playsinline muted></video>
    <div id="placeholder" class="placeholder">Caméra inactive</div>
  </div>

  <div class="metrics">
    <div class="card">
      <div class="card-label">Fréquence</div>
      <div>
        <span id="bpm" class="bpm-value">—</span>
        <span class="bpm-unit">bpm</span>
      </div>
    </div>
    <div class="card">
      <div class="card-label">Qualité du signal</div>
      <div id="quality" class="quality-value" data-level="bad">—</div>
      <div id="reason" class="reason"></div>
    </div>
  </div>

  <canvas id="signal-canvas" width="600" height="120"></canvas>

  <div class="controls">
    <button id="start-btn">Démarrer</button>
  </div>

  <div class="debug">
    <span>État</span><span id="dbg-state">—</span>
    <span>Source FPS</span><span id="dbg-fps">—</span>
    <span>Pics détectés</span><span id="dbg-peaks">—</span>
    <span>Score qualité</span><span id="dbg-score">—</span>
    <span>AC/DC</span><span id="dbg-acdc">—</span>
    <span>Artefacts</span><span id="dbg-art">—</span>
    <span>Échantillons</span><span id="dbg-samples">—</span>
  </div>
</div>

<script type="module">
// ============================================================
// Configuration
// ============================================================
const CONFIG = {
  VIDEO: { facingMode: 'environment', idealWidth: 320, idealHeight: 240, idealFrameRate: 30 },
  ROI_SIZE: 128,
  RESAMPLE_HZ: 60,
  BANDPASS: { low: 0.8, high: 3.0 },
  PEAKS: {
    minRR: 0.33,
    maxRR: 2.0,
    templateLen: 5,
    templateCorr: 0.6,
    marginSec: 0.3,
  },
  ARTIFACT: { sigmaThreshold: 5 },
  SQI: {
    clipMax: 0.05,
    motionMax: 0.15,
    acDcMin: 0.005,
    acDcRef: 0.02,
  },
  SETTLING: { minMs: 1500, stdRatio: 0.02, windowMs: 1000, minMean: 15 },
  RR: { window: 10, madFactor: 3 },
  BUFFER_SEC: 30,
  ANALYSIS_INTERVAL_MS: 250,
  MIN_BUFFER_SAMPLES: 180,
};

// ============================================================
// DSP : biquad, filtfilt, rééchantillonnage, pics, artefacts
// ============================================================
class Biquad {
  constructor(b0, b1, b2, a1, a2) {
    this.b0 = b0; this.b1 = b1; this.b2 = b2;
    this.a1 = a1; this.a2 = a2;
    this.z1 = 0; this.z2 = 0;
  }
  reset() { this.z1 = 0; this.z2 = 0; }
  process(x) {
    const y = this.b0 * x + this.z1;
    this.z1 = this.b1 * x - this.a1 * y + this.z2;
    this.z2 = this.b2 * x - this.a2 * y;
    return y;
  }
}

function designBiquad(fs, fc, type) {
  const w0 = 2 * Math.PI * fc / fs;
  const cosw0 = Math.cos(w0);
  const sinw0 = Math.sin(w0);
  const alpha = sinw0 / Math.SQRT2;
  let b0, b1, b2;
  if (type === 'low') {
    b0 = (1 - cosw0) / 2;
    b1 = 1 - cosw0;
    b2 = (1 - cosw0) / 2;
  } else {
    b0 = (1 + cosw0) / 2;
    b1 = -(1 + cosw0);
    b2 = (1 + cosw0) / 2;
  }
  const a0 = 1 + alpha;
  const a1 = -2 * cosw0;
  const a2 = 1 - alpha;
  return new Biquad(b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0);
}

function designBandpass(fs, lowHz, highHz) {
  return [designBiquad(fs, lowHz, 'high'), designBiquad(fs, highHz, 'low')];
}

function filtfilt(signal, filters) {
  const N = signal.length;
  if (N === 0) return new Float32Array(0);
  const pad = 20;
  const M = N + 2 * pad;
  const padded = new Float64Array(M);
  for (let i = 0; i < pad; i++) {
    padded[i] = signal[0];
    padded[N + pad + i] = signal[N - 1];
  }
  for (let i = 0; i < N; i++) padded[pad + i] = signal[i];

  const fwd = new Float64Array(M);
  for (const f of filters) f.reset();
  for (let i = 0; i < M; i++) {
    let x = padded[i];
    for (const f of filters) x = f.process(x);
    fwd[i] = x;
  }

  const rev = new Float64Array(M);
  for (const f of filters) f.reset();
  for (let i = M - 1; i >= 0; i--) {
    let x = fwd[i];
    for (const f of filters) x = f.process(x);
    rev[i] = x;
  }

  const out = new Float32Array(N);
  for (let i = 0; i < N; i++) out[i] = rev[pad + i];
  return out;
}

function resampleLinear(samples, targetHz) {
  if (samples.length < 2) {
    return { fs: targetHz, t0: 0, data: new Float32Array(0) };
  }
  const t0 = samples[0].t;
  const tEnd = samples[samples.length - 1].t;
  const n = Math.max(0, Math.floor(((tEnd - t0) / 1000) * targetHz) + 1);
  if (n < 2) {
    return { fs: targetHz, t0, data: new Float32Array(0) };
  }
  const data = new Float32Array(n);
  let j = 0;
  for (let i = 0; i < n; i++) {
    const t = t0 + (i * 1000) / targetHz;
    while (j < samples.length - 2 && samples[j + 1].t < t) j++;
    const a = samples[j];
    const b = samples[j + 1];
    const span = b.t - a.t;
    let frac = span > 0 ? (t - a.t) / span : 0;
    if (frac < 0) frac = 0;
    if (frac > 1) frac = 1;
    data[i] = a.v + (b.v - a.v) * frac;
  }
  return { fs: targetHz, t0, data };
}

function detectPeaks(signal, fs, opts) {
  const N = signal.length;
  if (N < 4) return [];
  const margin = Math.floor((opts.marginSec || 0) * fs);
  const startI = Math.max(1, margin);
  const endI = Math.min(N - 1, N - margin);
  if (startI >= endI) return [];

  const sorted = Float32Array.from(signal).sort();
  const median = sorted[Math.floor(N / 2)];
  const max = sorted[N - 1];
  const threshold = median + 0.4 * (max - median);
  const minDist = Math.max(1, Math.floor(opts.minRR * fs));

  const peaks = [];
  let lastPos = -minDist * 2;
  for (let i = startI; i < endI; i++) {
    if (signal[i] > threshold && signal[i] > signal[i - 1] && signal[i] >= signal[i + 1]) {
      const y0 = signal[i - 1];
      const y1 = signal[i];
      const y2 = signal[i + 1];
      const denom = y0 - 2 * y1 + y2;
      const delta = Math.abs(denom) > 1e-12 ? 0.5 * (y0 - y2) / denom : 0;
      const pos = i + delta;
      if (pos - lastPos >= minDist) {
        peaks.push({ pos, time: pos / fs });
        lastPos = pos;
      }
    }
  }
  return peaks;
}

function recoverMissedPeaks(signal, fs, peaks, opts) {
  if (peaks.length < 2) return peaks;
  const out = [peaks[0]];
  for (let i = 1; i < peaks.length; i++) {
    const prev = peaks[i - 1];
    const cur = peaks[i];
    const rr = cur.time - prev.time;
    if (rr > opts.maxRR) {
      const mid = Math.floor((prev.pos + cur.pos) / 2);
      const radius = Math.max(2, Math.floor((cur.pos - prev.pos) / 4));
      let bestPos = -1;
      let bestVal = -Infinity;
      const s = Math.max(1, mid - radius);
      const e = Math.min(signal.length - 1, mid + radius);
      for (let k = s; k < e; k++) {
        if (signal[k] > bestVal && signal[k] > signal[k - 1] && signal[k] >= signal[k + 1]) {
          bestVal = signal[k];
          bestPos = k;
        }
      }
      if (bestPos > 0) out.push({ pos: bestPos, time: bestPos / fs });
    }
    out.push(cur);
  }
  return out;
}

function validateTemplate(signal, fs, peaks, opts) {
  if (peaks.length < opts.templateLen) return peaks;
  const half = Math.max(2, Math.floor(0.15 * fs));
  const tpl = new Float32Array(2 * half);
  let count = 0;
  for (let k = 0; k < opts.templateLen; k++) {
    const p = Math.round(peaks[k].pos);
    if (p - half < 0 || p + half >= signal.length) continue;
    for (let i = 0; i < 2 * half; i++) tpl[i] += signal[p - half + i];
    count++;
  }
  if (!count) return peaks;
  for (let i = 0; i < tpl.length; i++) tpl[i] /= count;

  const out = [];
  for (const p of peaks) {
    const pi = Math.round(p.pos);
    if (pi - half < 0 || pi + half >= signal.length) {
      out.push(p);
      continue;
    }
    let dot = 0, na = 0, nb = 0;
    for (let i = 0; i < tpl.length; i++) {
      const a = signal[pi - half + i];
      const b = tpl[i];
      dot += a * b;
      na += a * a;
      nb += b * b;
    }
    const denom = Math.sqrt(na * nb);
    const corr = denom > 1e-9 ? dot / denom : 0;
    if (corr >= opts.templateCorr) out.push(p);
  }
  return out;
}

function detectArtifacts(signal, sigmaThreshold) {
  const N = signal.length;
  const flags = new Uint8Array(N);
  if (N < 4) return flags;
  const deriv = new Float32Array(N);
  for (let i = 1; i < N; i++) deriv[i] = signal[i] - signal[i - 1];
  let mean = 0;
  for (let i = 1; i < N; i++) mean += deriv[i];
  mean /= (N - 1);
  let v = 0;
  for (let i = 1; i < N; i++) v += (deriv[i] - mean) * (deriv[i] - mean);
  const std = Math.sqrt(v / (N - 1));
  if (std === 0) return flags;
  for (let i = 1; i < N; i++) {
    if (Math.abs(deriv[i] - mean) > sigmaThreshold * std) flags[i] = 1;
  }
  return flags;
}

// ============================================================
// Qualité : SQI et filtre RR
// ============================================================
function computeSQI(rawGrid, clipFraction, artifacts) {
  let mean = 0, maxv = -Infinity, minv = Infinity;
  for (let i = 0; i < rawGrid.length; i++) {
    const v = rawGrid[i];
    mean += v;
    if (v > maxv) maxv = v;
    if (v < minv) minv = v;
  }
  mean /= rawGrid.length;
  const acDc = mean > 0 ? (maxv - minv) / 2 / mean : 0;

  const strengthScore = Math.min(1, acDc / CONFIG.SQI.acDcRef);
  const clipScore = Math.max(0, 1 - clipFraction / CONFIG.SQI.clipMax);

  let artFrac = 0;
  if (artifacts.length > 0) {
    let s = 0;
    for (let i = 0; i < artifacts.length; i++) s += artifacts[i];
    artFrac = s / artifacts.length;
  }
  const motionScore = Math.max(0, 1 - artFrac / CONFIG.SQI.motionMax);

  const score = strengthScore * clipScore * motionScore;

  let reason = 'ok';
  if (clipFraction > CONFIG.SQI.clipMax) reason = 'clip';
  else if (artFrac > CONFIG.SQI.motionMax) reason = 'motion';
  else if (acDc < CONFIG.SQI.acDcMin) reason = 'weak';

  return { score, clipFraction, artFrac, acDc, reason };
}

function filterRR(rrList) {
  if (rrList.length === 0) return [];
  const recent = rrList.slice(-CONFIG.RR.window);
  const sorted = recent.slice().sort((a, b) => a - b);
  const median = sorted[Math.floor(sorted.length / 2)];
  const devs = recent.map(x => Math.abs(x - median)).sort((a, b) => a - b);
  const mad = devs[Math.floor(devs.length / 2)] || 0.02;
  return recent.filter(r => Math.abs(r - median) <= CONFIG.RR.madFactor * mad);
}

// ============================================================
// Caméra
// ============================================================
class CameraController {
  constructor() {
    this.stream = null;
    this.ctx = null;
    this.videoEl = null;
    this.locked = false;
    this.locking = false;
    this.lastCurrentTime = -1;
    this.lastCaptureTime = 0;
  }

  async start(videoEl, canvasEl) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Caméra indisponible — HTTPS requis');
    }
    this.videoEl = videoEl;
    canvasEl.width = CONFIG.ROI_SIZE;
    canvasEl.height = CONFIG.ROI_SIZE;
    this.ctx = canvasEl.getContext('2d', { willReadFrequently: true });
    this.stream = await navigator.mediaDevices.getUserMedia({ video: CONFIG.VIDEO });
    videoEl.srcObject = this.stream;
    try {
      await videoEl.play();
    } catch (e) {
      console.warn('[camera] play() :', e);
    }
    this.lastCurrentTime = -1;
    this.lastCaptureTime = 0;
  }

  async lockSettings() {
    if (this.locked || this.locking || !this.stream) return;
    this.locking = true;
    const track = this.stream.getVideoTracks()[0];
    if (!track) { this.locking = false; return; }
    try {
      await track.applyConstraints({
        advanced: [
          { exposureMode: 'manual' },
          { whiteBalanceMode: 'manual' },
          { focusMode: 'manual' },
        ],
      });
      this.locked = true;
    } catch (e) {
      console.warn('[camera] verrouillage partiel :', e.name);
    } finally {
      this.locking = false;
    }
  }

  captureFrame(rafTime) {
    if (!this.videoEl) return null;
    const vw = this.videoEl.videoWidth;
    const vh = this.videoEl.videoHeight;
    if (!vw || !vh) return null;

    const ct = this.videoEl.currentTime;
    if (ct === this.lastCurrentTime) {
      // Pas de nouvelle frame vidéo — fallback si > 100 ms écoulées
      if (this.lastCaptureTime && rafTime - this.lastCaptureTime < 100) return null;
    }
    this.lastCurrentTime = ct;
    this.lastCaptureTime = rafTime;

    const side = Math.min(vw, vh);
    const sx = (vw - side) / 2;
    const sy = (vh - side) / 2;
    this.ctx.drawImage(this.videoEl, sx, sy, side, side, 0, 0, CONFIG.ROI_SIZE, CONFIG.ROI_SIZE);
    const data = this.ctx.getImageData(0, 0, CONFIG.ROI_SIZE, CONFIG.ROI_SIZE).data;
    const n = data.length / 4;
    let r = 0;
    let clipped = 0;
    for (let i = 0; i < data.length; i += 4) {
      const rv = data[i];
      r += rv;
      if (rv >= 250) clipped++;
    }
    return { t: performance.now(), r: r / n, clipped: clipped / n };
  }

  stop() {
    if (this.stream) {
      this.stream.getTracks().forEach(t => t.stop());
      this.stream = null;
    }
    if (this.videoEl) this.videoEl.srcObject = null;
    this.locked = false;
    this.locking = false;
  }
}

// ============================================================
// Contrôleur vital
// ============================================================
class VitalsController {
  constructor(onUpdate) {
    this.onUpdate = onUpdate;
    this.reset();
  }

  reset() {
    this.state = 'idle';
    this.rawBuffer = [];
    this.settlingStart = 0;
    this.lastAnalysis = 0;
    this.lastPeaks = [];
    this.lastFiltered = null;
    this.lastFilteredFs = 0;
    this.stats = {
      state: 'idle',
      bpm: null,
      rr: [],
      quality: null,
      reason: 'ok',
      acDc: null,
      artifacts: null,
      peakCount: 0,
      sourceFps: 0,
      samples: 0,
    };
    this.onUpdate(this.stats);
  }

  startSettling() {
    this.settlingStart = performance.now();
    this.setState('settling');
  }

  setState(s) {
    this.state = s;
    this.stats.state = s;
    this.onUpdate(this.stats);
  }

  addSample(sample) {
    if (sample.r < 10) return;

    this.rawBuffer.push({ t: sample.t, v: sample.r, clipped: sample.clipped });
    const cutoff = sample.t - CONFIG.BUFFER_SEC * 1000;
    while (this.rawBuffer.length && this.rawBuffer[0].t < cutoff) this.rawBuffer.shift();

    if (this.state === 'settling') {
      this._checkSettling();
    } else if (this.state === 'measuring' && sample.t - this.lastAnalysis > CONFIG.ANALYSIS_INTERVAL_MS) {
      this.lastAnalysis = sample.t;
      this._analyze();
    }
  }

  _checkSettling() {
    const now = performance.now();
    if (now - this.settlingStart < CONFIG.SETTLING.minMs) return;
    const recent = this.rawBuffer.filter(s => s.t > now - CONFIG.SETTLING.windowMs);
    if (recent.length < 10) return;
    let mean = 0;
    for (const s of recent) mean += s.v;
    mean /= recent.length;
    if (mean < CONFIG.SETTLING.minMean) return;
    let v = 0;
    for (const s of recent) v += (s.v - mean) * (s.v - mean);
    const std = Math.sqrt(v / recent.length);
    if (std / mean < CONFIG.SETTLING.stdRatio) {
      this.lastAnalysis = 0;
      this.setState('measuring');
    }
  }

  _analyze() {
    const rs = resampleLinear(this.rawBuffer, CONFIG.RESAMPLE_HZ);
    if (rs.data.length < CONFIG.MIN_BUFFER_SAMPLES) return;
    const rawGrid = rs.data;
    const fs = rs.fs;

    let clipSum = 0;
    for (const s of this.rawBuffer) clipSum += s.clipped;
    const clipFraction = clipSum / this.rawBuffer.length;

    const artifacts = detectArtifacts(rawGrid, CONFIG.ARTIFACT.sigmaThreshold);

    const filters = designBandpass(fs, CONFIG.BANDPASS.low, CONFIG.BANDPASS.high);
    const filtered = filtfilt(rawGrid, filters);

    let peaks = detectPeaks(filtered, fs, CONFIG.PEAKS);
    peaks = recoverMissedPeaks(filtered, fs, peaks, CONFIG.PEAKS);
    peaks = validateTemplate(filtered, fs, peaks, CONFIG.PEAKS);

    const rr = [];
    for (let i = 1; i < peaks.length; i++) {
      rr.push(peaks[i].time - peaks[i - 1].time);
    }

    const sqi = computeSQI(rawGrid, clipFraction, artifacts);
    const validRR = filterRR(rr);

    let bpm = null;
    if (validRR.length > 0) {
      let sum = 0;
      for (const r of validRR) sum += r;
      const avg = sum / validRR.length;
      if (avg > 0) bpm = 60 / avg;
    }

    let sourceFps = 0;
    if (this.rawBuffer.length > 1) {
      const span = this.rawBuffer[this.rawBuffer.length - 1].t - this.rawBuffer[0].t;
      if (span > 0) sourceFps = 1000 * (this.rawBuffer.length - 1) / span;
    }

    let reason = sqi.reason;
    if (peaks.length === 0 && reason === 'ok') reason = 'noisy';

    this.lastPeaks = peaks;
    this.lastFiltered = filtered;
    this.lastFilteredFs = fs;

    this.stats = {
      state: this.state,
      bpm: bpm ? Math.round(bpm) : null,
      rr: validRR,
      quality: sqi.score,
      reason,
      acDc: sqi.acDc,
      artifacts: sqi.artFrac,
      peakCount: peaks.length,
      sourceFps: Math.round(sourceFps),
      samples: this.rawBuffer.length,
    };
    this.onUpdate(this.stats);
  }
}

// ============================================================
// Application
// ============================================================
const REASON_TEXT = {
  ok: 'Signal stable',
  clip: 'Trop de lumière — réduisez l’exposition',
  motion: 'Mouvement détecté — restez immobile',
  weak: 'Signal trop faible — couvrez mieux l’objectif',
  noisy: 'Signal bruité — pression plus douce',
};

class VitalsApp {
  constructor(els) {
    this.els = els;
    this.camera = new CameraController();
    this.vitals = new VitalsController(stats => this.render(stats));
    this.rafId = null;
    this.running = false;
    this.signalCtx = els.signalCanvas.getContext('2d');
    this.boundLoop = this.loop.bind(this);
  }

  async start() {
    if (this.running) return;
    this.els.startBtn.disabled = true;
    try {
      const roiCanvas = document.createElement('canvas');
      await this.camera.start(this.els.video, roiCanvas);
    } catch (e) {
      console.error('[app] caméra :', e);
      alert('Impossible d’accéder à la caméra : ' + (e && e.message ? e.message : e));
      this.els.startBtn.disabled = false;
      return;
    }
    this.els.video.classList.remove('hidden');
    this.els.placeholder.style.display = 'none';
    this.vitals.reset();
    this.vitals.startSettling();
    this.running = true;
    this.els.startBtn.textContent = 'Arrêter';
    this.els.startBtn.classList.add('stop');
    this.els.startBtn.disabled = false;
    this.rafId = requestAnimationFrame(this.boundLoop);
  }

  stop() {
    if (!this.running) return;
    this.running = false;
    if (this.rafId) cancelAnimationFrame(this.rafId);
    this.rafId = null;
    this.camera.stop();
    this.vitals.reset();
    this.els.video.classList.add('hidden');
    this.els.placeholder.style.display = '';
    this.els.startBtn.textContent = 'Démarrer';
    this.els.startBtn.classList.remove('stop');
    this.render(this.vitals.stats);
    this.clearSignal();
  }

  loop(rafTime) {
    if (!this.running) return;
    const frame = this.camera.captureFrame(rafTime);
    if (frame) this.vitals.addSample(frame);
    if (this.vitals.state === 'measuring' && !this.camera.locked && !this.camera.locking) {
      this.camera.lockSettings();
    }
    this.rafId = requestAnimationFrame(this.boundLoop);
  }

  clearSignal() {
    const c = this.els.signalCanvas;
    this.signalCtx.clearRect(0, 0, c.width, c.height);
  }

  render(stats) {
    this.els.bpm.textContent = stats.bpm != null ? stats.bpm : '—';

    let qText = '—';
    let level = 'bad';
    if (stats.state !== 'measuring') {
      qText = 'Acquisition…';
      level = 'mid';
    } else if (stats.quality == null) {
      qText = 'Analyse…';
      level = 'mid';
    } else if (stats.quality > 0.6) {
      qText = 'Bonne';
      level = 'good';
    } else if (stats.quality > 0.3) {
      qText = 'Moyenne';
      level = 'mid';
    } else {
      qText = 'Faible';
      level = 'bad';
    }
    this.els.quality.textContent = qText;
    this.els.quality.dataset.level = level;

    this.els.reason.textContent = stats.state === 'measuring' ? (REASON_TEXT[stats.reason] || '') : '';
    this.els.reason.dataset.code = stats.reason || 'ok';

    this.els.dbgState.textContent = stats.state;
    this.els.dbgFps.textContent = stats.sourceFps ? stats.sourceFps + ' Hz' : '—';
    this.els.dbgPeaks.textContent = stats.peakCount != null ? stats.peakCount : '—';
    this.els.dbgScore.textContent = stats.quality != null ? (stats.quality * 100).toFixed(0) + '%' : '—';
    this.els.dbgAcdc.textContent = stats.acDc != null ? (stats.acDc * 100).toFixed(2) + '%' : '—';
    this.els.dbgArt.textContent = stats.artifacts != null ? (stats.artifacts * 100).toFixed(1) + '%' : '—';
    this.els.dbgSamples.textContent = stats.samples != null ? stats.samples : 0;

    this.drawSignal();
  }

  drawSignal() {
    const c = this.els.signalCanvas;
    const ctx = this.signalCtx;
    ctx.clearRect(0, 0, c.width, c.height);

    const sig = this.vitals.lastFiltered;
    if (!sig || sig.length < 2) return;

    let maxv = 1e-9;
    for (let i = 0; i < sig.length; i++) {
      const a = Math.abs(sig[i]);
      if (a > maxv) maxv = a;
    }

    const W = c.width;
    const H = c.height;
    const midY = H / 2;
    const scaleY = (H / 2 - 6) / maxv;

    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < sig.length; i++) {
      const x = (i / (sig.length - 1)) * W;
      const y = midY - sig[i] * scaleY;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.fillStyle = '#fbbf24';
    const peaks = this.vitals.lastPeaks || [];
    for (const p of peaks) {
      const idx = Math.round(p.pos);
      if (idx < 0 || idx >= sig.length) continue;
      const x = (idx / (sig.length - 1)) * W;
      const y = midY - sig[idx] * scaleY;
      ctx.beginPath();
      ctx.arc(x, y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ============================================================
// Bootstrap
// ============================================================
const els = {
  video: document.getElementById('video'),
  placeholder: document.getElementById('placeholder'),
  signalCanvas: document.getElementById('signal-canvas'),
  bpm: document.getElementById('bpm'),
  quality: document.getElementById('quality'),
  reason: document.getElementById('reason'),
  startBtn: document.getElementById('start-btn'),
  dbgState: document.getElementById('dbg-state'),
  dbgFps: document.getElementById('dbg-fps'),
  dbgPeaks: document.getElementById('dbg-peaks'),
  dbgScore: document.getElementById('dbg-score'),
  dbgAcdc: document.getElementById('dbg-acdc'),
  dbgArt: document.getElementById('dbg-art'),
  dbgSamples: document.getElementById('dbg-samples'),
};

const app = new VitalsApp(els);

els.startBtn.addEventListener('click', () => {
  if (app.running) app.stop();
  else app.start();
});
</script>
</body>
