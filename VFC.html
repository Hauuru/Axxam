
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesure VFC v3 — Diagnostic SETTLING</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --accent: #38bdf8;
            --danger: #f87171; --warn: #fcd34d; --success: #4ade80; --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            padding: 1rem; padding-top: 2rem;
        }
        .container {
            background: var(--card); border-radius: 1.5rem; padding: 1.5rem;
            width: 100%; max-width: 520px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.15rem; font-weight: 700; text-align: center; margin-bottom: 0.25rem; color: var(--accent); }
        .version-tag { text-align: center; font-size: 0.75rem; color: var(--muted); margin-bottom: 1rem; letter-spacing: 0.05em; }
        .video-wrapper {
            position: relative; width: 100%; aspect-ratio: 1 / 1; background: #000;
            border-radius: 1rem; overflow: hidden; margin-bottom: 0.75rem; border: 2px solid #334155;
        }
        #cameraPreview { width: 100%; height: 100%; object-fit: cover; }
        #waveformCanvas {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 28%;
            background: rgba(0,0,0,0.45); border-top: 1px solid #475569;
        }
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0.75rem; font-size: 0.85rem; color: var(--muted);
        }
        .state-badge {
            padding: 0.2rem 0.7rem; border-radius: 999px; font-weight: 700;
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .state-NO_FINGER { background: #7f1d1d; color: #fca5a5; }
        .state-SETTLING { background: #78350f; color: #fcd34d; }
        .state-MEASURING { background: #14532d; color: #86efac; }

        .diag-panel {
            background: #0f172a; border: 1px solid #334155; border-radius: 0.9rem;
            padding: 0.8rem 0.9rem; margin-bottom: 0.75rem;
        }
        .diag-title {
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.5rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .diag-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.2rem 0; font-size: 0.82rem; border-bottom: 1px solid #1e293b;
        }
        .diag-row:last-child { border-bottom: none; }
        .diag-label { color: var(--muted); }
        .diag-value { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent); }
        .diag-value.bad { color: var(--danger); }
        .diag-value.warn { color: var(--warn); }
        .diag-value.good { color: var(--success); }

        .reason-box {
            background: #450a0a; border: 1px solid #7f1d1d; border-radius: 0.6rem;
            padding: 0.5rem 0.7rem; font-size: 0.8rem; color: #fca5a5;
            margin-top: 0.5rem; display: none; line-height: 1.4; white-space: pre-wrap;
        }
        .reason-box.visible { display: block; }

        .timer { text-align: center; font-size: 1.8rem; font-weight: 700; color: var(--accent); margin-bottom: 0.5rem; font-variant-numeric: tabular-nums; }

        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 0.75rem; }
        .metric { background: #0f172a; padding: 0.6rem; border-radius: 0.7rem; text-align: center; }
        .metric .label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
        .metric .value { font-size: 1.35rem; font-weight: 700; color: var(--accent); margin-top: 0.15rem; }
        .metric .unit { font-size: 0.7rem; color: var(--muted); }

        button {
            width: 100%; padding: 0.8rem; border: none; border-radius: 0.7rem;
            font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        #startBtn { background: var(--accent); color: #0f172a; margin-bottom: 0.4rem; }
        #copyBtn { background: #334155; color: var(--text); margin-top: 0.3rem; }
        #copyBtn:not(:disabled) { background: var(--success); color: #0f172a; }
        #exportBtn { background: #1e293b; color: var(--muted); margin-top: 0.4rem; font-size: 0.8rem; padding: 0.6rem; }
        .message-box {
            margin-top: 0.6rem; padding: 0.6rem 0.75rem; border-radius: 0.7rem;
            font-size: 0.82rem; line-height: 1.4; display: none; white-space: pre-wrap;
        }
        .message-box.error { display: block; background: #450a0a; border: 1px solid var(--danger); color: #fca5a5; }
        .message-box.info { display: block; background: #0c4a6e; border: 1px solid var(--accent); color: #bae6fd; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Mesure VFC</h1>
    <p class="version-tag">Version 3 — Focus SETTLING</p>

    <div class="video-wrapper">
        <video id="cameraPreview" playsinline muted autoplay></video>
        <canvas id="waveformCanvas"></canvas>
    </div>

    <div class="status-bar">
        <span>État du doigt :</span>
        <span id="stateBadge" class="state-badge state-NO_FINGER">NO_FINGER</span>
    </div>

    <div class="diag-panel" id="diagPanel">
        <div class="diag-title">
            <span>Diagnostic qualité (SQI)</span>
            <span id="diagScore" style="color:var(--muted); font-weight:400; text-transform:none;">score: —</span>
        </div>
        <div class="diag-row"><span class="diag-label">Perfusion (AC/DC)</span><span class="diag-value" id="sqiPerfusion">—</span></div>
        <div class="diag-row"><span class="diag-label">Corrélation morpho.</span><span class="diag-value" id="sqiTemplate">—</span></div>
        <div class="diag-row"><span class="diag-label">Pixels saturés</span><span class="diag-value" id="sqiClipped">—</span></div>
        <div class="diag-row"><span class="diag-label">Mouvement</span><span class="diag-value" id="sqiMotion">—</span></div>
        <div class="diag-row"><span class="diag-label">SNR (dB)</span><span class="diag-value" id="sqiSnr">—</span></div>
        <div class="reason-box" id="reasonBox"></div>
    </div>

    <div class="timer" id="timerDisplay">45s</div>

    <div class="metrics-grid">
        <div class="metric"><div class="label">FC</div><div class="value" id="heartRate">--</div><div class="unit">bpm</div></div>
        <div class="metric"><div class="label">RMSSD</div><div class="value" id="rmssd">--</div><div class="unit">ms</div></div>
        <div class="metric"><div class="label">SDNN</div><div class="value" id="sdnn">--</div><div class="unit">ms</div></div>
        <div class="metric"><div class="label">Qualité</div><div class="value" id="quality">--</div><div class="unit">&nbsp;</div></div>
    </div>

    <button id="startBtn">Démarrer la mesure (45s)</button>
    <button id="copyBtn" disabled>📋 Copier le résumé</button>
    <button id="exportBtn">⬇ Exporter le journal de débogage</button>

    <div id="messageBox" class="message-box"></div>
</div>

<script type="module">
    import { PPG } from 'https://esm.sh/@sontakey/ppg-js';

    // ---- DOM (identiques à la v2) ----
    const video = document.getElementById('cameraPreview');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const stateBadge = document.getElementById('stateBadge');
    const timerDisplay = document.getElementById('timerDisplay');
    const heartRateEl = document.getElementById('heartRate');
    const rmssdEl = document.getElementById('rmssd');
    const sdnnEl = document.getElementById('sdnn');
    const qualityEl = document.getElementById('quality');
    const startBtn = document.getElementById('startBtn');
    const copyBtn = document.getElementById('copyBtn');
    const exportBtn = document.getElementById('exportBtn');
    const messageBox = document.getElementById('messageBox');
    const reasonBox = document.getElementById('reasonBox');
    const diagScore = document.getElementById('diagScore');
    const sqiPerfusion = document.getElementById('sqiPerfusion');
    const sqiTemplate  = document.getElementById('sqiTemplate');
    const sqiClipped   = document.getElementById('sqiClipped');
    const sqiMotion    = document.getElementById('sqiMotion');
    const sqiSnr       = document.getElementById('sqiSnr');

    // ---- Variables ----
    let ppg = null;
    let measurementActive = false;
    let timerInterval = null;
    let remainingSeconds = 45;
    let lastState = 'NO_FINGER';
    let waveformData = [];
    const MAX_WAVEFORM_POINTS = 200;

    // ---- Canvas ----
    function resizeCanvas() {
        canvas.width = canvas.clientWidth * window.devicePixelRatio;
        canvas.height = canvas.clientHeight * window.devicePixelRatio;
        ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawWaveform() {
        const w = canvas.clientWidth; const h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);
        if (waveformData.length < 2) return;
        const min = Math.min(...waveformData); const max = Math.max(...waveformData);
        const range = max - min || 1;
        ctx.beginPath(); ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
        for (let i = 0; i < waveformData.length; i++) {
            const x = (i / (waveformData.length - 1)) * w;
            const y = h - ((waveformData[i] - min) / range) * (h * 0.8) - h * 0.1;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // ---- Messages ----
    function showMessage(text, type = 'info') {
        messageBox.textContent = text;
        messageBox.className = `message-box ${type}`;
    }
    function hideMessage() { messageBox.className = 'message-box'; messageBox.textContent = ''; }

    // ---- Mise à jour du panneau SQI (identique à la v2) ----
    function updateDiagnostics(metrics) {
        if (!metrics) return;
        const sqi = metrics.sqi;
        if (sqi?.score !== undefined) {
            diagScore.textContent = `score: ${sqi.score.toFixed(2)}`;
            diagScore.style.color = sqi.score >= 0.6 ? 'var(--success)' : (sqi.score >= 0.4 ? 'var(--warn)' : 'var(--danger)');
        }
        if (sqi?.perfusion !== undefined) {
            const v = sqi.perfusion;
            sqiPerfusion.textContent = `${v.toFixed(3)} %`;
            sqiPerfusion.className = `diag-value ${v >= 0.4 ? 'good' : (v >= 0.2 ? 'warn' : 'bad')}`;
        }
        if (sqi?.templateCorrelation !== undefined) {
            const v = sqi.templateCorrelation;
            sqiTemplate.textContent = v.toFixed(3);
            sqiTemplate.className = `diag-value ${v >= 0.7 ? 'good' : (v >= 0.6 ? 'warn' : 'bad')}`;
        }
        if (sqi?.clippedFraction !== undefined) {
            const v = sqi.clippedFraction;
            sqiClipped.textContent = `${(v * 100).toFixed(2)} %`;
            sqiClipped.className = `diag-value ${v <= 0.02 ? 'good' : (v <= 0.05 ? 'warn' : 'bad')}`;
        }
        if (sqi?.motion !== undefined) {
            const v = sqi.motion;
            sqiMotion.textContent = v.toFixed(4);
            sqiMotion.className = `diag-value ${v <= 0.01 ? 'good' : (v <= 0.05 ? 'warn' : 'bad')}`;
        }
        if (sqi?.snrDb !== undefined) {
            const v = sqi.snrDb;
            sqiSnr.textContent = `${v.toFixed(1)} dB`;
            sqiSnr.className = `diag-value ${v >= 10 ? 'good' : (v >= 5 ? 'warn' : 'bad')}`;
        }
        const q = metrics.quality;
        if (q && q.good === false && q.reason) {
            const guidance = q.guidanceMessage || '';
            reasonBox.textContent = `Échec : ${q.reason} — ${guidance}`;
            reasonBox.classList.add('visible');
        } else {
            reasonBox.classList.remove('visible');
            reasonBox.textContent = '';
        }
    }

    // ---- Initialisation PPG ----
    function initPPG() {
        if (ppg) return;
        ppg = new PPG({ video: video });

        ppg.addEventListener('state', (e) => {
            const detail = e.detail || {};
            const state = detail.state;
            const reason = detail.reason;
            lastState = state;
            stateBadge.textContent = state;
            stateBadge.className = `state-badge state-${state}`;

            // *** DIAGNOSTIC SPÉCIFIQUE À SETTLING ***
            if (state === 'NO_FINGER') {
                showMessage('Placez votre doigt sur la caméra arrière et le flash.', 'info');
            } else if (state === 'SETTLING') {
                let msg = 'Signal en cours de stabilisation... Ne bougez plus.';
                if (reason === 'weak_pulse') {
                    msg += '\n💡 Le pouls est trop faible. Appuyez plus fort ou déplacez légèrement le doigt.';
                } else if (reason === 'motion') {
                    msg += '\n💡 Mouvement détecté. Posez le téléphone sur une surface stable.';
                } else if (reason === 'saturated') {
                    msg += '\n💡 Signal saturé. Éloignez légèrement le doigt ou réduisez la luminosité.';
                } else if (reason) {
                    msg += `\n(raison : ${reason})`;
                }
                showMessage(msg, 'info');
            } else if (state === 'MEASURING') {
                hideMessage();
            }
        });

        ppg.addEventListener('waveform', (e) => {
            const sample = e.detail;
            if (typeof sample === 'number' && !isNaN(sample)) {
                waveformData.push(sample);
                if (waveformData.length > MAX_WAVEFORM_POINTS) waveformData.shift();
                drawWaveform();
            }
        });

        ppg.addEventListener('metrics', (e) => {
            const m = e.detail;
            updateDiagnostics(m);
            if (m.quality && m.quality.good) {
                if (m.heartRate) heartRateEl.textContent = Math.round(m.heartRate);
                if (m.rmssd !== undefined) rmssdEl.textContent = Math.round(m.rmssd);
                if (m.sdnn !== undefined) sdnnEl.textContent = Math.round(m.sdnn);
                qualityEl.textContent = 'Bonne';
                qualityEl.style.color = 'var(--success)';
            } else {
                heartRateEl.textContent = '--'; rmssdEl.textContent = '--'; sdnnEl.textContent = '--';
                qualityEl.textContent = 'Faible'; qualityEl.style.color = 'var(--danger)';
            }
        });

        ppg.addEventListener('quality', (e) => {
            const d = e.detail;
            if (d) updateDiagnostics({ sqi: d.sqi || d, quality: d.quality || d });
        });

        // *** GESTION D'ERREUR ROBUSTE (plus de [object Object]) ***
        ppg.addEventListener('error', (e) => {
            const err = e.detail;
            let msg = 'Erreur inconnue';
            if (typeof err === 'string') {
                msg = err;
            } else if (err && typeof err === 'object') {
                msg = err.message || err.code || JSON.stringify(err);
            }
            console.error('PPG Error:', err);
            showMessage(`Erreur : ${msg}`, 'error');
        });
    }

    // ---- Démarrer (identique à la v2, avec réinitialisation) ----
    async function startMeasurement() {
        hideMessage(); reasonBox.classList.remove('visible'); initPPG();
        waveformData = [];
        heartRateEl.textContent = '--'; rmssdEl.textContent = '--'; sdnnEl.textContent = '--';
        qualityEl.textContent = '--'; qualityEl.style.color = 'var(--accent)';
        copyBtn.disabled = true; exportBtn.disabled = true;
        [sqiPerfusion, sqiTemplate, sqiClipped, sqiMotion, sqiSnr].forEach(el => {
            el.textContent = '—'; el.className = 'diag-value';
        });
        diagScore.textContent = 'score: —'; diagScore.style.color = 'var(--muted)';

        try { await ppg.start(); } catch (err) {
            console.error('Erreur de démarrage:', err);
            const msg = err?.message || err?.code || JSON.stringify(err);
            showMessage(`Impossible de démarrer : ${msg}`, 'error');
            return;
        }

        measurementActive = true; startBtn.disabled = true;
        remainingSeconds = 45; timerDisplay.textContent = `${remainingSeconds}s`;

        try {
            const stream = video.srcObject;
            if (stream) {
                const track = stream.getVideoTracks()[0];
                if (track && track.getCapabilities().torch) {
                    await track.applyConstraints({ advanced: [{ torch: true }] });
                }
            }
        } catch (e) { console.warn('Flash non disponible', e); }

        timerInterval = setInterval(() => {
            remainingSeconds--; timerDisplay.textContent = `${remainingSeconds}s`;
            if (remainingSeconds <= 0) stopMeasurement();
        }, 1000);
    }

    // ---- Arrêter (identique à la v2) ----
    function stopMeasurement() {
        if (!measurementActive) return;
        measurementActive = false; clearInterval(timerInterval); startBtn.disabled = false;
        if (ppg) try { ppg.stop(); } catch (e) {}
        try {
            const stream = video.srcObject;
            if (stream) {
                const track = stream.getVideoTracks()[0];
                if (track) track.applyConstraints({ advanced: [{ torch: false }] });
            }
        } catch (e) {}
        exportBtn.disabled = false;
        generateSummary();
    }

    // ---- Résumé (identique à la v2) ----
    function generateSummary() {
        if (!ppg) return;
        let summary;
        try { summary = ppg.getSessionSummary(); } catch (e) {
            showMessage(`Erreur getSessionSummary : ${e.message}`, 'error'); return;
        }
        if (!summary || !summary.quality || !summary.quality.good) {
            const reason = summary?.quality?.reason || 'signal_non_exploitable';
            const guidance = summary?.quality?.guidanceMessage || 'Vérifiez la position du doigt et restez immobile.';
            showMessage(`Mesure échouée (${reason}). ${guidance}\nDernier état : ${lastState}.`, 'error');
            return;
        }
        const date = new Date().toISOString().slice(0, 10);
        const hr = Math.round(summary.heartRate || 0);
        const rmssd = Math.round(summary.rmssd || 0);
        const sdnn = Math.round(summary.sdnn || 0);
        const text = `VFC ${date}: RMSSD=${rmssd}ms, SDNN=${sdnn}ms, FC=${hr}bpm, qualité=bonne`;
        showMessage(`Résumé prêt :\n${text}`, 'info');
        copyBtn.disabled = false;
        copyBtn.onclick = async () => {
            try { await navigator.clipboard.writeText(text); } catch (e) {
                const ta = document.createElement('textarea'); ta.value = text;
                document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                document.body.removeChild(ta);
            }
            copyBtn.textContent = '✅ Copié !';
            setTimeout(() => { copyBtn.textContent = '📋 Copier le résumé'; }, 2000);
        };
    }

    // ---- Export (identique à la v2) ----
    exportBtn.addEventListener('click', () => {
        if (!ppg) return;
        try {
            if (typeof ppg.exportDebugLog === 'function') {
                const log = ppg.exportDebugLog();
                const blob = new Blob([log], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `vfc-debug-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`;
                a.click(); URL.revokeObjectURL(url);
                showMessage('Journal de débogage exporté.', 'info');
            } else {
                showMessage('exportDebugLog() non disponible.', 'error');
            }
        } catch (e) { showMessage(`Export impossible : ${e.message}`, 'error'); }
    });

    startBtn.addEventListener('click', startMeasurement);
    window.addEventListener('beforeunload', () => { if (ppg) try { ppg.destroy(); } catch (e) {} });
</script>
</body>
</html>
