<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mesure VFC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column; padding: 20px;
  }
  .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; }
  .screen.active { display: flex; }
  h1 { font-size: 1.5rem; font-weight: 600; }
  p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; max-width: 340px; }
  button {
    background: #3b82f6; color: white; border: none;
    padding: 16px 32px; border-radius: 12px; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #334155; }
  #video { display: none; }
  .timer { font-size: 3rem; font-variant-numeric: tabular-nums; font-weight: 700; color: #3b82f6; }
  #waveform { width: 100%; max-width: 500px; height: 120px; background: #1e293b; border-radius: 12px; }
  .status { font-size: 0.9rem; color: #94a3b8; max-width: 340px; }
  .results { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
  .metric { display: flex; justify-content: space-between; padding: 16px 20px; background: #1e293b; border-radius: 12px; }
  .metric-label { color: #94a3b8; }
  .metric-value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric-unit { color: #64748b; margin-left: 4px; font-weight: 400; font-size: 0.85em; }
  .quality-good { color: #22c55e; }
  .quality-medium { color: #eab308; }
  .quality-bad { color: #ef4444; }
  #summary {
    background: #1e293b; padding: 16px; border-radius: 12px;
    font-family: 'Courier New', monospace; font-size: 0.85rem;
    word-break: break-word; width: 100%; max-width: 400px; color: #cbd5e1;
  }
  .error { color: #ef4444; padding: 16px; max-width: 340px; }
</style>
</head>
<body>

<div id="screen-home" class="screen active">
  <h1>Mesure VFC</h1>
  <p>Pose ton doigt sur la caméra arrière avec le flash allumé. Reste immobile pendant 45 secondes.</p>
  <button id="btn-start">Démarrer la mesure</button>
</div>

<div id="screen-measure" class="screen">
  <div class="timer" id="timer">45s</div>
  <canvas id="waveform" width="500" height="120"></canvas>
  <div class="status" id="status">Initialisation…</div>
  <button id="btn-stop" class="secondary">Arrêter</button>
</div>

<div id="screen-result" class="screen">
  <h1>Résultat</h1>
  <div class="results">
    <div class="metric">
      <span class="metric-label">Fréquence cardiaque</span>
      <span class="metric-value" id="res-hr">—</span>
    </div>
    <div class="metric">
      <span class="metric-label">RMSSD</span>
      <span class="metric-value" id="res-rmssd">—</span>
    </div>
    <div class="metric">
      <span class="metric-label">SDNN</span>
      <span class="metric-value" id="res-sdnn">—</span>
    </div>
    <div class="metric">
      <span class="metric-label">Qualité du signal</span>
      <span class="metric-value" id="res-quality">—</span>
    </div>
  </div>
  <div id="summary"></div>
  <button id="btn-copy">Copier le résumé</button>
  <button id="btn-restart" class="secondary">Nouvelle mesure</button>
</div>

<div id="screen-error" class="screen">
  <h1>Erreur</h1>
  <p class="error" id="error-msg"></p>
  <button id="btn-back">Retour</button>
</div>

<video id="video" autoplay playsinline muted></video>

<script type="module">
import { PPG } from 'https://esm.sh/@sontakey/ppg-js';

const DURATION = 45;
let stream = null, ppg = null, running = false, startTime = 0;
let canvas, ctx;
const $ = id => document.getElementById(id);

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(`screen-${name}`).classList.add('active');
}

async function startMeasurement() {
  try {
    showScreen('measure');
    canvas = $('waveform');
    ctx = canvas.getContext('2d');
    $('status').textContent = 'Demande d\'accès à la caméra…';

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 320 }, height: { ideal: 240 } }
    });

    const video = $('video');
    video.srcObject = stream;
    await video.play();

    // Activation explicite du flash (torch)
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.torch) {
      try {
        await track.applyConstraints({ advanced: [{ torch: true }] });
      } catch (e) {
        console.warn('Flash non activable :', e);
      }
    } else {
      $('status').textContent = 'Flash non supporté par ce navigateur. Mesure en lumière ambiante…';
    }

    // Initialisation de ppg-js
    ppg = new PPG();
    
    // Écoute des métriques en temps réel
    ppg.on('metrics', (metrics) => {
      if (metrics.quality && metrics.quality.good) {
        $('status').textContent = `Mesure en cours… FC: ${Math.round(metrics.heartRate)} bpm`;
      } else if (metrics.quality && metrics.quality.reason) {
        $('status').textContent = `Signal : ${metrics.quality.reason}`;
      }
    });

    // Écoute du signal pour dessiner la waveform
    ppg.on('waveform', (data) => {
      drawWaveform(data);
    });

    // Écoute des erreurs
    ppg.on('error', (err) => {
      console.error('Erreur ppg-js:', err);
      $('status').textContent = `Erreur : ${err.message || err}`;
    });

    // Démarrage de la mesure
    await ppg.start();
    running = true;
    startTime = performance.now();
    $('status').textContent = 'Mesure en cours… garde le doigt immobile.';
    loopTimer();

  } catch (err) {
    showError(err.message || String(err));
  }
}

function loopTimer() {
  if (!running) return;
  const elapsed = (performance.now() - startTime) / 1000;
  const remaining = Math.max(0, DURATION - elapsed);
  $('timer').textContent = Math.ceil(remaining) + 's';
  if (remaining <= 0) {
    stopMeasurement();
    return;
  }
  requestAnimationFrame(loopTimer);
}

function drawWaveform(data) {
  if (!canvas || !data || data.length < 2) return;
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, w, h);
  
  const vals = Array.from(data);
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = max - min || 1;
  
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  vals.forEach((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 20) - 10;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
}

async function stopMeasurement() {
  running = false;
  if (ppg) {
    try { await ppg.stop(); } catch (e) { console.warn(e); }
  }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  if (!ppg) {
    showError('Aucune mesure disponible.');
    return;
  }

  // Récupération des métriques finales
  const metrics = ppg.metrics; // Selon l'API, les métriques sont peut-être exposées ainsi
  // Si l'API ne fournit pas directement les métriques finales, on utilise les dernières reçues.
  // Pour être robuste, on écoute l'événement 'result' ou on utilise une variable globale.
  // Dans la documentation, ppg-js émet des événements. On va donc stocker les dernières métriques.
  // (Voir ci-dessous)
  
  // Solution : on stocke les métriques dans une variable globale via l'événement
  // Pour simplifier, on va utiliser une promesse ou un écouteur.
  // Mais pour l'instant, on va utiliser une variable globale `lastMetrics`.
}

// Variable globale pour stocker les dernières métriques
let lastMetrics = null;
// On modifie l'écouteur 'metrics' pour stocker
// (Ceci est fait dans startMeasurement, mais on peut le faire ici)
// Pour des raisons de clarté, je vais réécrire la partie stopMeasurement.

// En fait, je vais réécrire le code pour que ce soit plus propre.
</script>
</body>
</html>
