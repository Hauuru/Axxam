<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mesure VFC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column; padding: 20px;
  }
  .screen { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; }
  .screen.active { display: flex; }
  h1 { font-size: 1.5rem; font-weight: 600; }
  p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; max-width: 340px; }
  button {
    background: #3b82f6; color: white; border: none;
    padding: 16px 32px; border-radius: 12px; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: opacity 0.2s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #334155; }
  .video-container {
    width: 100%; max-width: 320px; height: 240px;
    background: #000; border-radius: 12px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  #preview { width: 100%; height: 100%; object-fit: cover; }
  .timer { font-size: 3rem; font-variant-numeric: tabular-nums; font-weight: 700; color: #3b82f6; }
  #waveform { width: 100%; max-width: 500px; height: 120px; background: #1e293b; border-radius: 12px; }
  .status { font-size: 0.9rem; color: #94a3b8; max-width: 340px; min-height: 2.4em; }
  .results { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
  .metric { display: flex; justify-content: space-between; padding: 16px 20px; background: #1e293b; border-radius: 12px; }
  .metric-label { color: #94a3b8; }
  .metric-value { font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric-unit { color: #64748b; margin-left: 4px; font-weight: 400; font-size: 0.85em; }
  .quality-good { color: #22c55e; }
  .quality-medium { color: #eab308; }
  .quality-bad { color: #ef4444; }
  #summary {
    background: #1e293b; padding: 16px; border-radius: 12px;
    font-family: 'Courier New', monospace; font-size: 0.85rem;
    word-break: break-word; width: 100%; max-width: 400px; color: #cbd5e1;
    white-space: pre-wrap;
  }
  .error { color: #ef4444; padding: 16px; max-width: 340px; }
  .debug { font-size: 0.75rem; color: #64748b; max-width: 400px; word-break: break-all; }
</style>
</head>
<body>

<div id="screen-home" class="screen active">
  <h1>Mesure VFC</h1>
  <p>Pose ton doigt sur la caméra arrière avec le flash allumé. Reste immobile.</p>
  <button id="btn-start">Démarrer la mesure</button>
</div>

<div id="screen-measure" class="screen">
  <div class="timer" id="timer">45s</div>
  <div class="video-container">
    <video id="preview" autoplay playsinline muted></video>
  </div>
  <canvas id="waveform" width="500" height="120"></canvas>
  <div class="status" id="status">Initialisation…</div>
  <button id="btn-stop" class="secondary">Arrêter</button>
</div>

<div id="screen-result" class="screen">
  <h1>Résultat</h1>
  <div class="results">
    <div class="metric">
      <span class="metric-label">Fréquence cardiaque</span>
      <span class="metric-value" id="res-hr">—</span>
    </div>
    <div class="metric">
      <span class="metric-label">RMSSD</span>
      <span class="metric-value" id="res-rmssd">—</span>
    </div>
    <div class="metric">
      <span class="metric-label">SDNN</span>
      <span class="metric-value" id="res-sdnn">—</span>
    </div>
    <div class="metric">
      <span class="metric-label">Qualité du signal</span>
      <span class="metric-value" id="res-quality">—</span>
    </div>
  </div>
  <div id="summary"></div>
  <div class="debug" id="debug-info"></div>
  <button id="btn-copy">Copier le résumé</button>
  <button id="btn-restart" class="secondary">Nouvelle mesure</button>
</div>

<div id="screen-error" class="screen">
  <h1>Erreur</h1>
  <p class="error" id="error-msg"></p>
  <div class="debug" id="error-debug"></div>
  <button id="btn-back">Retour</button>
</div>

<script type="module">
import { PPG } from 'https://esm.sh/@sontakey/ppg-js';

const DURATION = 45;
let ppg = null, running = false, startTime = 0;
let canvas, ctx;
let waveformSamples = [];
const MAX_WAVEFORM_POINTS = 300;
let lastMetrics = null;
let lastState = 'NO_FINGER';
const $ = id => document.getElementById(id);

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(`screen-${name}`).classList.add('active');
}

async function startMeasurement() {
  try {
    showScreen('measure');
    canvas = $('waveform');
    ctx = canvas.getContext('2d');
    waveformSamples = [];
    lastMetrics = null;
    lastState = 'NO_FINGER';
    $('status').textContent = 'Demande d\'accès à la caméra…';

    const videoEl = $('preview');
    
    // Initialisation de ppg-js avec notre élément vidéo pour l'aperçu
    ppg = new PPG({ video: videoEl });

    ppg.addEventListener('ready', (e) => {
      const d = e.detail;
      console.log('Ready:', d);
      if (!d.torchSupported) {
        $('status').textContent = 'Flash non supporté par ce navigateur. Éclaire avec une lampe.';
      } else {
        $('status').textContent = 'Caméra prête. Pose ton doigt…';
      }
    });

    ppg.addEventListener('state', (e) => {
      const { state, reason } = e.detail;
      lastState = state;
      if (state === 'NO_FINGER') {
        $('status').textContent = 'Pose ton doigt sur la caméra et le flash…';
      } else if (state === 'SETTLING') {
        $('status').textContent = 'Initialisation du signal… reste immobile.';
      } else if (state === 'MEASURING') {
        $('status').textContent = 'Mesure en cours…';
      } else {
        $('status').textContent = `État : ${state} (${reason || ''})`;
      }
    });

    ppg.addEventListener('metrics', (e) => {
      lastMetrics = e.detail;
      const m = e.detail;
      if (m.quality && m.quality.good) {
        $('status').textContent = `Mesure en cours… FC: ${Math.round(m.heartRate)} bpm`;
      } else if (m.quality && m.quality.reason) {
        $('status').textContent = `Signal : ${m.quality.reason}`;
      }
    });

    ppg.addEventListener('waveform', (e) => {
      const sample = e.detail;
      if (typeof sample === 'number') {
        waveformSamples.push(sample);
        if (waveformSamples.length > MAX_WAVEFORM_POINTS) {
          waveformSamples.shift();
        }
        drawWaveform();
      }
    });

    ppg.addEventListener('error', (e) => {
      console.error('Erreur ppg-js:', e.detail);
      $('status').textContent = `Erreur : ${e.detail.message || e.detail.code || e.detail}`;
    });

    await ppg.start();
    running = true;
    startTime = performance.now();
    loopTimer();

  } catch (err) {
    showError(err.message || String(err), err.stack);
  }
}

function loopTimer() {
  if (!running) return;
  const elapsed = (performance.now() - startTime) / 1000;
  const remaining = Math.max(0, DURATION - elapsed);
  $('timer').textContent = Math.ceil(remaining) + 's';
  if (remaining <= 0) {
    stopMeasurement();
    return;
  }
  requestAnimationFrame(loopTimer);
}

function drawWaveform() {
  if (!canvas || waveformSamples.length < 2) return;
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, w, h);

  const min = Math.min(...waveformSamples);
  const max = Math.max(...waveformSamples);
  const range = max - min || 1;

  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 2;
  ctx.beginPath();
  waveformSamples.forEach((v, i) => {
    const x = (i / (waveformSamples.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 20) - 10;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
}

async function stopMeasurement() {
  running = false;
  if (ppg) {
    try { await ppg.stop(); } catch (e) { console.warn(e); }
  }

  let summary = null;
  try {
    summary = ppg.getSessionSummary();
  } catch (e) {
    console.warn('getSessionSummary a échoué', e);
  }

  // Si le résumé n'est pas disponible, on tente avec les dernières métriques
  if (!summary || summary.heartRate === undefined) {
    summary = lastMetrics;
  }

  // Vérification stricte des données
  if (!summary || summary.heartRate === undefined || summary.rmssd === undefined || summary.sdnn === undefined) {
    const debugInfo = `Dernier état : ${lastState}\n` +
                      `Dernières métriques : ${JSON.stringify(lastMetrics)}\n` +
                      `Résumé session : ${JSON.stringify(summary)}`;
    showError('Les données de mesure sont incomplètes. Le signal n\'a probablement pas été jugé valide (doigt mal positionné, flash absent, ou mouvement).', debugInfo);
    return;
  }

  displayResult(summary);
}

function displayResult(result) {
  const hr = result.heartRate;
  const rmssd = result.rmssd;
  const sdnn = result.sdnn;
  const q = result.quality ? (result.quality.good ? 'bonne' : (result.quality.reason || result.quality.code || 'mauvaise')) : 'mauvaise';

  const qClass = q === 'bonne' ? 'quality-good' : (q === 'moyenne' ? 'quality-medium' : 'quality-bad');

  $('res-hr').innerHTML = `${Math.round(hr * 10) / 10} <span class="metric-unit">bpm</span>`;
  $('res-rmssd').innerHTML = `${Math.round(rmssd)} <span class="metric-unit">ms</span>`;
  $('res-sdnn').innerHTML = `${Math.round(sdnn)} <span class="metric-unit">ms</span>`;
  $('res-quality').innerHTML = `<span class="${qClass}">${q}</span>`;

  const date = new Date().toISOString().slice(0, 10);
  $('summary').textContent = `VFC ${date}: RMSSD=${Math.round(rmssd)}ms, SDNN=${Math.round(sdnn)}ms, FC=${Math.round(hr * 10) / 10}bpm, qualité=${q}`;

  // Affichage des infos de debug utiles
  let debugStr = '';
  if (result.quality && result.quality.code) {
    debugStr += `Code qualité : ${result.quality.code}\n`;
  }
  if (result.rmssdFloorMs) {
    debugStr += `Plancher de bruit RMSSD : ${Math.round(result.rmssdFloorMs)} ms\n`;
  }
  $('debug-info').textContent = debugStr;

  showScreen('result');
}

function showError(msg, debug = '') {
  $('error-msg').textContent = msg;
  $('error-debug').textContent = debug;
  showScreen('error');
}

$('btn-start').addEventListener('click', startMeasurement);
$('btn-stop').addEventListener('click', stopMeasurement);
$('btn-restart').addEventListener('click', () => {
  if (ppg) {
    try { ppg.destroy(); } catch (e) {}
    ppg = null;
  }
  waveformSamples = [];
  lastMetrics = null;
  lastState = 'NO_FINGER';
  showScreen('home');
});
$('btn-back').addEventListener('click', () => showScreen('home'));
$('btn-copy').addEventListener('click', async () => {
  const text = $('summary').textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const r = document.createRange();
    r.selectNode($('summary'));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
    document.execCommand('copy');
  }
  $('btn-copy').textContent = 'Copié !';
  setTimeout(() => { $('btn-copy').textContent = 'Copier le résumé'; }, 1500);
});
</script>
</body>
</html>
