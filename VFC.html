<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesure VFC - Tracker EM/SFC</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #e2e8f0;
            --accent: #38bdf8;
            --danger: #f87171;
            --success: #4ade80;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container {
            background: var(--card);
            border-radius: 1.5rem;
            padding: 1.5rem;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1rem;
            color: var(--accent);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #000;
            border-radius: 1rem;
            overflow: hidden;
            margin-bottom: 1rem;
            border: 2px solid #334155;
        }
        #cameraPreview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #waveformCanvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: rgba(0,0,0,0.5);
            border-top: 1px solid #475569;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
            color: var(--muted);
        }
        .state-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
        }
        .state-NO_FINGER { background: #7f1d1d; color: #fca5a5; }
        .state-SETTLING { background: #78350f; color: #fcd34d; }
        .state-MEASURING { background: #14532d; color: #86efac; }
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }
        .metric {
            background: #0f172a;
            padding: 0.75rem;
            border-radius: 0.75rem;
            text-align: center;
        }
        .metric .label {
            font-size: 0.75rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .metric .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-top: 0.25rem;
        }
        .metric .unit {
            font-size: 0.75rem;
            color: var(--muted);
        }
        button {
            width: 100%;
            padding: 0.875rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #startBtn {
            background: var(--accent);
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        #copyBtn {
            background: #334155;
            color: var(--text);
            margin-top: 0.5rem;
        }
        #copyBtn:not(:disabled) {
            background: var(--success);
            color: #0f172a;
        }
        .message-box {
            margin-top: 0.75rem;
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            line-height: 1.4;
            display: none;
        }
        .message-box.error {
            display: block;
            background: #450a0a;
            border: 1px solid var(--danger);
            color: #fca5a5;
        }
        .message-box.info {
            display: block;
            background: #0c4a6e;
            border: 1px solid var(--accent);
            color: #bae6fd;
        }
        .timer {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-variant-numeric: tabular-nums;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Mesure VFC</h1>

    <div class="video-wrapper">
        <video id="cameraPreview" playsinline muted autoplay></video>
        <canvas id="waveformCanvas"></canvas>
    </div>

    <div class="status-bar">
        <span>État du doigt :</span>
        <span id="stateBadge" class="state-badge state-NO_FINGER">NO_FINGER</span>
    </div>

    <div class="timer" id="timerDisplay">45s</div>

    <div class="metrics-grid">
        <div class="metric">
            <div class="label">FC</div>
            <div class="value" id="heartRate">--</div>
            <div class="unit">bpm</div>
        </div>
        <div class="metric">
            <div class="label">RMSSD</div>
            <div class="value" id="rmssd">--</div>
            <div class="unit">ms</div>
        </div>
        <div class="metric">
            <div class="label">SDNN</div>
            <div class="value" id="sdnn">--</div>
            <div class="unit">ms</div>
        </div>
        <div class="metric">
            <div class="label">Qualité</div>
            <div class="value" id="quality">--</div>
            <div class="unit">&nbsp;</div>
        </div>
    </div>

    <button id="startBtn">Démarrer la mesure (45s)</button>
    <button id="copyBtn" disabled>📋 Copier le résumé</button>

    <div id="messageBox" class="message-box"></div>
</div>

<script type="module">
    import { PPG } from 'https://esm.sh/@sontakey/ppg-js';

    // ---- DOM ----
    const video = document.getElementById('cameraPreview');
    const canvas = document.getElementById('waveformCanvas');
    const ctx = canvas.getContext('2d');
    const stateBadge = document.getElementById('stateBadge');
    const timerDisplay = document.getElementById('timerDisplay');
    const heartRateEl = document.getElementById('heartRate');
    const rmssdEl = document.getElementById('rmssd');
    const sdnnEl = document.getElementById('sdnn');
    const qualityEl = document.getElementById('quality');
    const startBtn = document.getElementById('startBtn');
    const copyBtn = document.getElementById('copyBtn');
    const messageBox = document.getElementById('messageBox');

    // ---- Variables ----
    let ppg = null;
    let measurementActive = false;
    let timerInterval = null;
    let remainingSeconds = 45;
    let latestMetrics = null;
    let lastState = 'NO_FINGER';
    let waveformData = []; // buffer des échantillons pour le canvas
    const MAX_WAVEFORM_POINTS = 200;

    // ---- Canvas ----
    function resizeCanvas() {
        canvas.width = canvas.clientWidth * window.devicePixelRatio;
        canvas.height = canvas.clientHeight * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawWaveform() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);

        if (waveformData.length < 2) return;

        // Normalisation simple
        const min = Math.min(...waveformData);
        const max = Math.max(...waveformData);
        const range = max - min || 1;

        ctx.beginPath();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';

        for (let i = 0; i < waveformData.length; i++) {
            const x = (i / (waveformData.length - 1)) * w;
            const y = h - ((waveformData[i] - min) / range) * (h * 0.8) - h * 0.1;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    // ---- Messages ----
    function showMessage(text, type = 'info') {
        messageBox.textContent = text;
        messageBox.className = `message-box ${type}`;
    }

    function hideMessage() {
        messageBox.className = 'message-box';
        messageBox.textContent = '';
    }

    // ---- Initialisation PPG ----
    function initPPG() {
        if (ppg) return;

        ppg = new PPG({
            video: video, // La bibliothèque gère la caméra et le flash
        });

        // Événement : état du doigt (NO_FINGER, SETTLING, MEASURING)
        ppg.addEventListener('state', (e) => {
            const { state, reason } = e.detail;
            lastState = state;
            stateBadge.textContent = state;
            stateBadge.className = `state-badge state-${state}`;
            if (state === 'NO_FINGER') {
                showMessage('Placez votre doigt sur la caméra arrière et le flash.', 'info');
            } else if (state === 'SETTLING') {
                showMessage('Signal en cours de stabilisation... Ne bougez plus.', 'info');
            } else if (state === 'MEASURING') {
                hideMessage();
            }
        });

        // Événement : forme d'onde (un échantillon par frame)
        ppg.addEventListener('waveform', (e) => {
            const sample = e.detail; // valeur numérique unique
            if (typeof sample === 'number' && !isNaN(sample)) {
                waveformData.push(sample);
                if (waveformData.length > MAX_WAVEFORM_POINTS) {
                    waveformData.shift();
                }
                drawWaveform();
            }
        });

        // Événement : métriques en temps réel
        ppg.addEventListener('metrics', (e) => {
            const m = e.detail;
            latestMetrics = m;

            if (m.heartRate && m.heartRate > 0) {
                heartRateEl.textContent = Math.round(m.heartRate);
            }
            if (m.rmssd !== undefined && m.rmssd > 0) {
                rmssdEl.textContent = Math.round(m.rmssd);
            }
            if (m.sdnn !== undefined && m.sdnn > 0) {
                sdnnEl.textContent = Math.round(m.sdnn);
            }
            if (m.quality) {
                qualityEl.textContent = m.quality.good ? 'Bonne' : 'Faible';
                qualityEl.style.color = m.quality.good ? 'var(--success)' : 'var(--danger)';
            }
        });

        // Événement : erreur
        ppg.addEventListener('error', (e) => {
            const err = e.detail;
            console.error('PPG Error:', err);
            showMessage(`Erreur : ${err.message || err.code || 'Inconnue'}`, 'error');
            stopMeasurement();
        });
    }

    // ---- Démarrer la mesure ----
    async function startMeasurement() {
        hideMessage();
        initPPG();

        // Réinitialiser l'interface
        waveformData = [];
        heartRateEl.textContent = '--';
        rmssdEl.textContent = '--';
        sdnnEl.textContent = '--';
        qualityEl.textContent = '--';
        qualityEl.style.color = 'var(--accent)';
        copyBtn.disabled = true;
        latestMetrics = null;

        try {
            await ppg.start();
        } catch (err) {
            console.error('Erreur de démarrage:', err);
            showMessage(`Impossible de démarrer la caméra : ${err.message || err.code}`, 'error');
            return;
        }

        measurementActive = true;
        startBtn.disabled = true;
        remainingSeconds = 45;
        timerDisplay.textContent = `${remainingSeconds}s`;

        // Activer le flash si possible (la bibliothèque le fait souvent, mais on force via l'API)
        try {
            const stream = video.srcObject;
            if (stream) {
                const track = stream.getVideoTracks()[0];
                if (track) {
                    const capabilities = track.getCapabilities();
                    if (capabilities.torch) {
                        await track.applyConstraints({ advanced: [{ torch: true }] });
                    }
                }
            }
        } catch (flashErr) {
            console.warn('Flash non disponible:', flashErr);
        }

        // Minuteur
        timerInterval = setInterval(() => {
            remainingSeconds--;
            timerDisplay.textContent = `${remainingSeconds}s`;
            if (remainingSeconds <= 0) {
                stopMeasurement();
            }
        }, 1000);
    }

    // ---- Arrêter la mesure ----
    function stopMeasurement() {
        if (!measurementActive) return;
        measurementActive = false;
        clearInterval(timerInterval);
        startBtn.disabled = false;

        // Arrêter la caméra
        if (ppg) {
            try { ppg.stop(); } catch (e) { /* ignore */ }
        }

        // Éteindre le flash
        try {
            const stream = video.srcObject;
            if (stream) {
                const track = stream.getVideoTracks()[0];
                if (track) {
                    track.applyConstraints({ advanced: [{ torch: false }] });
                }
            }
        } catch (e) { /* ignore */ }

        // Générer le résumé
        generateSummary();
    }

    // ---- Générer le résumé ----
    function generateSummary() {
        if (!ppg) {
            showMessage('Aucune session PPG active.', 'error');
            return;
        }

        let summary;
        try {
            summary = ppg.getSessionSummary();
        } catch (e) {
            console.error('getSessionSummary a échoué:', e);
            showMessage(`Erreur lors de la récupération du résumé : ${e.message}`, 'error');
            return;
        }

        // Vérifier que le signal est exploitable
        if (!summary || !summary.quality || !summary.quality.good) {
            const reason = summary?.quality?.reason || 'signal_non_exploitable';
            const guidance = summary?.quality?.guidanceMessage || 'Assurez-vous que le doigt couvre bien la caméra et le flash, et restez immobile.';
            showMessage(
                `Mesure échouée (${reason}). ${guidance}\n` +
                `Dernier état : ${lastState}.`,
                'error'
            );
            return;
        }

        const date = new Date().toISOString().slice(0, 10);
        const hr = Math.round(summary.heartRate || 0);
        const rmssd = Math.round(summary.rmssd || 0);
        const sdnn = Math.round(summary.sdnn || 0);
        const qualityLabel = summary.quality.good ? 'bonne' : 'faible';

        const text = `VFC ${date}: RMSSD=${rmssd}ms, SDNN=${sdnn}ms, FC=${hr}bpm, qualité=${qualityLabel}`;

        // Afficher le résumé et activer le bouton copier
        showMessage(`Résumé prêt :\n${text}`, 'info');

        copyBtn.disabled = false;
        copyBtn.onclick = async () => {
            try {
                await navigator.clipboard.writeText(text);
                copyBtn.textContent = '✅ Copié !';
                setTimeout(() => { copyBtn.textContent = '📋 Copier le résumé'; }, 2000);
            } catch (err) {
                // Fallback
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                copyBtn.textContent = '✅ Copié !';
                setTimeout(() => { copyBtn.textContent = '📋 Copier le résumé'; }, 2000);
            }
        };
    }

    // ---- Événements UI ----
    startBtn.addEventListener('click', startMeasurement);

    // Nettoyage
    window.addEventListener('beforeunload', () => {
        if (ppg) try { ppg.destroy(); } catch (e) { /* ignore */ }
    });
</script>
</body>
</html>
